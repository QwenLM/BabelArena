  {user_instruction}

  # နောက်ခံရှင်းလင်းချက်
  - ၎င်းသည် အသုံးပြုသူနှင့် assistant အကြား ဆွေးနွေးမှုပုံစံဖြစ်ပြီး assistant သည် အချက်အလက်ရယူရန်နှင့် လုပ်ဆောင်ချက်များ ပြီးမြောက်စေရန် ကိရိယာများကို ခေါ်ယူအသုံးပြုနိုင်ကာ ကိရိယာမှ ပြန်လည်ရရှိသော ရလဒ်များသည် tool ဖြင့် စတင်ပါမည်
  - သင်သည် အသုံးပြုသူညွှန်ကြားချက် ပြီးမြောက်မှုရှိမရှိကို အကဲဖြတ်ရပါမည်
  - ဆွေးနွေးမှုအလှည့်အများပြားသောကြောင့် ကျွန်ုပ်တို့သည် sliding window အကဲဖြတ်နည်းလမ်းကို အသုံးပြုပြီး တစ်ကြိမ်လျှင် ဆွေးနွေးမှုအလှည့် ၁၀ ကို မြင်တွေ့ရကာ ဖြတ်ပိုင်းတစ်ခုနှင့်တစ်ခုကြားတွင် ဆွေးနွေးမှုအလှည့် ၂ ခု ထပ်နေပါသည်
  - သင်သည် ဖြတ်ပိုင်း အမှတ် {window_idx} ကို အကဲဖြတ်နေခြင်းဖြစ်သည် (ယခုတာဝန်တွင် စုစုပေါင်း ဖြတ်ပိုင်း {total_windows} ခုရှိသည်)
  - <window_content> တွင် လက်ရှိဖြတ်ပိုင်း၏ ဆွေးနွေးမှုအကြောင်းအရာများ ပါဝင်သည်
  - <memory> တွင် ယခင်ဖြတ်ပိုင်းများမှ အချက်အလက်များကို မှတ်ဉာဏ်ချုပ်ခြင်း ပါဝင်သည်
  - <current_evaluation> တွင် ယခင်ဖြတ်ပိုင်းများ၏ အကဲဖြတ်ရလဒ်များ ပါဝင်သည်

  # တာဝန်
  - လက်ရှိဖြတ်ပိုင်း၏ ဆွေးနွေးမှုအကြောင်းအရာများအပေါ် အခြေခံ၍ အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်ပါ လိုအပ်ချက်များ အားလုံး ပြည့်မီမှုရှိမရှိကို ဆုံးဖြတ်ပါ
  - assistant သည် ဤဖြတ်ပိုင်းနှင့် သမိုင်းကြောင်းဖြတ်ပိုင်းများတွင် အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်ကို ပြီးမြောက်စေခဲ့ပါကသာ သင်သည် အခြေအနေကို false မှ true သို့ အပ်ဒိတ်လုပ်နိုင်သည်
  - assistant သည် ဤဖြတ်ပိုင်းတွင် ယခင်က မှန်ကန်သော ကောက်ချက်ကို ပယ်ဖျက်ခဲ့ပါကသာ သင်သည် true ကို ထပ်မံ၍ false သို့ အပ်ဒိတ်လုပ်နိုင်သည် (သို့သော် သတိပြုရန် - အကယ်၍ အသုံးပြုသူ၏ လိုအပ်ချက်ကိုယ်တိုင် ပြောင်းလဲသွားပါက ဥပမာ အော်ဒါတင်ပြီးနောက် ကိုယ်တိုင် ပယ်ဖျက်ခြင်းမျိုးဖြစ်ပါက မူလအော်ဒါတင်ခြင်း လိုအပ်ချက်အပေါ် အကဲဖြတ်ချက်ကို ပယ်ဖျက်သင့်မည် မဟုတ်ပါ)
  - မလိုအပ်သော ပြင်ဆင်မှုများ မဖြစ်ပေါ်စေရန် လက်ရှိဆွေးနွေးမှု ဖြတ်ပိုင်း၏ တိုးတက်မှုကို ရယူရန် "အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်" ကို ကိုးကားနိုင်သည်
  - လက်ရှိဖြတ်ပိုင်းအကြောင်းအရာ <window_content> နှင့် မှတ်ဉာဏ်ချုပ်အကြောင်းအရာ <memory> ကို ပေါင်းစပ်ပြီး သတိပြုရန်အချက်များရှိ စည်းမျဉ်းများအတိုင်း memory အကြောင်းအရာကို ညှိယူကာ အသစ်<memory> အဖြစ် ထုတ်ပေးပါ

  # သတိပြုရန်အချက်များ
  - အရေးကြီးသည် - အကဲဖြတ်ချက်အားလုံးသည် assistant ၏ ပြန်လည်ဖြေကြားချက်နှင့် ကိရိယာခေါ်ယူမှု လိုအပ်ချက်များက အသုံးပြုသူညွှန်ကြားချက်ကို ပြီးမြောက်စေမှုအပေါ် မူတည်သည်၊ အသုံးပြုသူ၏ ဆွေးနွေးမှုတွင် ဖော်ပြထားသော အကြောင်းအရာများကို assistant အတွက် အကြံပြုချက်နှင့် လမ်းညွှန်မှုများအဖြစ်သာ သတ်မှတ်ပြီး အကဲဖြတ်မှုစံနှုန်းများကို တိုက်ရိုက်မသက်ရောက်စေပါ၊ အားလုံးသည် အသုံးပြုသူညွှန်ကြားချက်အပေါ် မူတည်သည်!
  - အရေးကြီးသည် - ရှာဖွေရေးအမျိုးအစား tool မှ ပြန်လည်ရရှိသော ရလဒ်များသည် assistant အတွက်သာ မြင်တွေ့ရပြီး assistant က အသုံးပြုသူအတွက် အကြံပြုသော အကြောင်းအရာကို ကိုယ်စားမပြုသောကြောင့် အကဲဖြတ်ရလဒ်ကိုလည်း တိုက်ရိုက်မသက်ရောက်စေပါ၊ အားလုံးသည် assistant က အချက်အလက်ရယူပြီးနောက် အသုံးပြုသူအား ပြန်လည်ဖြေကြားချက်အပေါ် မူတည်ရပါမည်! ထို့အပြင် Assistant သည် Tool ၏ ပြန်လည်ရရှိသော ရလဒ်များကိုလည်း ဖန်တီးယူ၍ မရနိုင်ကြောင်း သတိပြုရပါမည်!
  - အရေးကြီးသည် - ဝယ်ယူခြင်းဆိုင်ရာ ညွှန်ကြားချက်များအတွက် (အော်ဒါအသေးစိတ်အချက်အလက်များ ပါဝင်ပြီး အော်ဒါဖန်တီးရန် လိုအပ်သော) assistant သည် အော်ဒါတင်ခြင်း လုပ်ဆောင်ချက်ကို တကယ်ပင် ပြီးမြောက်စေခဲ့ခြင်း ရှိမရှိကို အတည်ပြုရပါမည်။ assistant သည် အော်ဒါတင်ခြင်း လုပ်ဆောင်ချက်ကို ပြီးမြောက်ခဲ့သည်ဟု အမှားသဘောထားနိုင်ပြီး တကယ်တမ်းတွင် ကိရိယာခေါ်ယူမှု ကျရှုံးနိုင်သည် သို့မဟုတ် အသုံးပြုသူက "ကိုယ်တိုင် အော်ဒါတင်နိုင်သည်" ဟု ပြောဆိုခြင်းမျိုး စသည်တို့ကို လိုအပ်ချက်မပြည့်မီဟု သတ်မှတ်ရပါမည်
  - ကုန်ပစ္စည်းအရေအတွက်၊ ပို့ဆောင်ချိန်ကဲ့သို့သော အော်ဒါအသေးစိတ်အချက်အလက်များ ပါဝင်သော အသုံးပြုသူညွှန်ကြားချက်များအတွက် မူလအသုံးပြုသူညွှန်ကြားချက် လိုအပ်ချက်များကို တိကျစွာ ပြည့်မီရပါမည် (ကုန်ပစ္စည်းအရေအတွက် ကွဲလွဲမှု မရှိရ၊ မျှော်လင့်ထားသော ပို့ဆောင်ချိန်ထက် နောက်ကျမရ)၊ အသုံးပြုသူ၏ လျှော့ပေးမှုလုပ်ရပ်များသည် အကဲဖြတ်ရလဒ်ကို မသက်ရောက်စေပါ (ဥပမာ အသုံးပြုသူက "ပစ္စည်းတစ်ခုခု နည်းနည်းလျှော့လည်းရသည်"၊ "အော်ဒါအကြောင်းအရာကို သဘောမတူညီမှုမရှိ" သို့မဟုတ် "နောက်ကျပို့ဆောင်လည်းရသည်" စသည်တို့ကို ပြောဆိုခြင်း)၊ ထိုကဲ့သို့သော အခြေအနေများကို လိုအပ်ချက်မပြည့်မီဟုသာ ဆက်လက်သတ်မှတ်ရပါမည်
  - စာသားအကြောင်းအရာ ကိုက်ညီမှုပါဝင်သော လိပ်စာ သို့မဟုတ် အော်ဒါမှတ်ချက်အမျိုးအစား အသုံးပြုသူညွှန်ကြားချက်များအတွက် လုပ်ဆောင်ချက်ညီမျှမှု မူဝါဒကို အသုံးပြုပါ - လက်တွေ့အကြောင်းအရာသည် တူညီသောလုပ်ဆောင်ချက်ကို ဆောင်ရွက်နိုင်ပါက (ဥပမာ ပို့ဆောင်မည့်နေရာကို ခန့်မှန်းတွက်ချက်နိုင်ခြင်း သို့မဟုတ် ဝယ်ယူသူ၏ အဓိကလိုအပ်ချက်များကို လက်ဆင့်ကမ်းနိုင်ခြင်း)၊ ဖော်ပြချက် လုံးဝကိုက်ညီမှုမရှိခြင်း သို့မဟုတ် အသေးစိတ်အချက်အလက်များ လိုအပ်နေခြင်းရှိသော်လည်း လိုအပ်ချက်ပြည့်မီသည်ဟု သတ်မှတ်ပါ
  - အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်ကို သင့်လျော်စွာ ခွဲခြမ်းပြီး လိုအပ်ချက်ငယ်တစ်ခုစီ ပြည့်မီမှုရှိမရှိကို အကဲဖြတ်ပါ -
    - အကယ်၍ လက်ရှိဖြတ်ပိုင်းတွင် လိုအပ်ချက်ငယ်တစ်ခုခုကို မပါဝင်စေပါက လက်ရှိတွင် မပါဝင်ကြောင်း မှတ်တမ်းတင်ပါ;
    - အကယ်၍ လက်ရှိဖြတ်ပိုင်းတွင် လိုအပ်ချက်ငယ်တစ်ခုခု ပါဝင်သော်လည်း လုံးဝဆုံးဖြတ်၍မရပါက နောက်ဆက်တွဲဆုံးဖြတ်ရန် အဓိကအချက်အလက်များကို memory တွင် မှတ်တမ်းတင်ထားပါ
    - နောက်ဆက်တွဲဖြတ်ပိုင်းများတွင် ဆက်လက်ဆုံးဖြတ်နိုင်ရန် memory တွင် လိုအပ်ချက်ငယ်များနှင့် သက်ဆိုင်သော အဓိကအချက်အလက်များနှင့် ၎င်းတို့၏ သက်ဆိုင်ရာအလှည့် [x] ကို မှတ်တမ်းတင်ပါ

  # ပုံစံလိုအပ်ချက်များ
  - သင်၏ ပြန်လည်ဖြေကြားချက်သည် JSON အရာဝတ္ထုတစ်ခုဖြစ်ပြီး အောက်ပါကွက်လပ်များ ပါဝင်ရပါမည် -
  - `justification` - အကဲဖြတ်ရလဒ်အတွက် အကျဉ်းချုပ်ရှင်းလင်းချက်
  - `meetExpectation` - အကဲဖြတ်ရလဒ် (true သို့မဟုတ် false)

  # နမူနာအင်ပုတ်ဖွဲ့စည်းပုံ -
  <window_content>xxx</window_content>
  <memory>xxx</memory>
  <current_evaluation>xxx</current_evaluation>

  # နမူနာပြန်လည်ဖြေကြားချက်ဖွဲ့စည်းပုံ -
  ```json
  {{
      "memory": <ယခင်ဖြတ်ပိုင်းအချက်အလက်များအပေါ် ချုပ်ငယ်>,
      "justification": "<အကဲဖြတ်ရလဒ်အတွက် အကျဉ်းချုပ်ရှင်းလင်းချက်>",
      "meetExpectation": <true or false>
  }}
  ```
lao: |-
  # ຂໍ້ມູນລະບົບ
  {env_info}

  # ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້
  {user_instruction}

  # ຄຳອະທິບາຍພື້ນຖານ
  - ນີ້ແມ່ນສາກການສົນທະນາລະຫວ່າງ user ແລະ assistant, ບ່ອນທີ່ assistant ສາມາດເອີ້ນໃຊ້ເຄື່ອງມືເພື່ອດຶງຂໍ້ມູນ ແລະ ດຳເນີນການ, ຜົນການຕອບກັບຂອງເຄື່ອງມືຈະເລີ່ມຕົ້ນດ້ວຍ tool
  - ທ່ານຕ້ອງປະເມີນວ່າຄຳສັ່ງຂອງຜູ້ໃຊ້ໄດ້ຖືກປະຕິບັດສຳເລັດຫຼືບໍ່
  - ເນື່ອງຈາກຈຳນວນຮອບການສົນທະນາມີຫຼາຍ, ພວກເຮົານຳໃຊ້ວິທີການປະເມີນແບບປ່ອງຢ້ຽມເລື່ອນ, ນັ້ນແມ່ນແຕ່ລະຄັ້ງຈະເຫັນ 10 ຮອບການສົນທະນາ, ລະຫວ່າງແຕ່ລະປ່ອງຢ້ຽມ ມີ 2 ຮອບການສົນທະນາຊ້ອນກັນ
  - ທ່ານກຳລັງປະເມີນປ່ອງຢ້ຽມ ທີ່ {window_idx} (ວຽກງານຄັ້ງນີ້ມີທັງໝົດ {total_windows} ປ່ອງຢ້ຽມ)
  - <window_content>ປະກອບມີເນື້ອຫາການສົນທະນາຂອງປ່ອງຢ້ຽມ ປະຈຸບັນ
  - <memory>ປະກອບມີບົດສະຫຼຸບຄວາມຈື່ຈຳຂອງຂໍ້ມູນປ່ອງຢ້ຽມ ກ່ອນໜ້າ
  - <current_evaluation>ປະກອບມີຜົນການປະເມີນຂອງປ່ອງຢ້ຽມ ກ່ອນໜ້າ

  # ພາລະກິດ
  - ອີງໃສ່ເນື້ອຫາການສົນທະນາຂອງປ່ອງຢ້ຽມ ປະຈຸບັນ, ຕັດສິນວ່າຄວາມຕ້ອງການໃນຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້ໄດ້ຖືກຕອບສະໜອງຄົບຖ້ວນຫຼືບໍ່
  - ທ່ານສາມາດປັບປຸງສະຖານະຈາກ false ເປັນ true, ກໍ່ຕໍ່ເມື່ອ assistant ໄດ້ສຳເລັດຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້ໃນປ່ອງຢ້ຽມ ນີ້ ແລະ ປະຫວັດປ່ອງຢ້ຽມ
  - ທ່ານກໍ່ສາມາດປັບປຸງ true ກັບຄືນເປັນ false, ກໍ່ຕໍ່ເມື່ອ assistant ໄດ້ລົ້ມລ້າງສະຫຼຸບຜົນທີ່ຖືກຕ້ອງກ່ອນໜ້າໃນປ່ອງຢ້ຽມ ນີ້ (ແຕ່ກະລຸນາສັງເກດ: ຖ້າຄວາມຕ້ອງການຂອງຜູ້ໃຊ້ປ່ຽນແປງເອງ, ຕົວຢ່າງເຊັ່ນ ຍົກເລີກຫຼັງຈາກສັ່ງຊື້, ກໍ່ບໍ່ຄວນລົ້ມລ້າງການປະເມີນຄວາມຕ້ອງການການສັ່ງຊື້ເດີມ)
  - ທ່ານສາມາດອ້າງອີງ "ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້" ເພື່ອຮັບຮູ້ຄວາມຄືບໜ້າຂອງປ່ອງຢ້ຽມ ການສົນທະນາປະຈຸບັນ, ຫຼີກລ່ຽງການປັບປຸງທີ່ບໍ່ຈຳເປັນ
  - ລວມເນື້ອຫາປ່ອງຢ້ຽມ ປະຈຸບັນ <window_content> ແລະ ເນື້ອຫາບົດສະຫຼຸບຄວາມຈື່ຈຳ <memory>, ແລະ ປັບປຸງເນື້ອຫາ memory ຕາມກົດລະບຽບໃນຂໍ້ຄວນລະວັງ ກ່ອນຈະສົ່ງອອກເປັນ <memory> ໃໝ່

  # ຂໍ້ຄວນລະວັງ
  - ສຳຄັນ: ການປະເມີນທັງໝົດອີງໃສ່ວ່າການຕອບກັບຂອງ assistant ແລະ ຄຳຮ້ອງເອີ້ນໃຊ້ເຄື່ອງມືໄດ້ສຳເລັດຄຳສັ່ງຂອງຜູ້ໃຊ້ຫຼືບໍ່, user ໃນການສົນທະນາສະແດງອອກເນື້ອຫາຖືເປັນພຽງຄຳແນະນຳ ແລະ ການຊີ້ນຳໃຫ້ assistant, ຈະບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ມາດຕະຖານການປະເມີນ, ທຸກຢ່າງອີງໃສ່ຄຳສັ່ງຂອງຜູ້ໃຊ້ເປັນຫຼັກ!
  - ສຳຄັນ: ຜົນການຕອບກັບຂອງເຄື່ອງມືປະເພດສືບຄົ້ນ ຈະເຫັນໄດ້ສະເພາະ assistant ເທົ່ານັ້ນ, ບໍ່ໄດ້ໝາຍຄວາມວ່າເປັນເນື້ອຫາທີ່ assistant ແນະນຳໃຫ້ຜູ້ໃຊ້, ດັ່ງນັ້ນຈຶ່ງບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ຜົນການປະເມີນ, ທຸກຢ່າງຕ້ອງອີງໃສ່ການຕອບກັບຂອງ assistant ຫຼັງຈາກໄດ້ຮັບຂໍ້ມູນແລ້ວຕໍ່ຜູ້ໃຊ້ເປັນຫຼັກ! ພ້ອມກັນນັ້ນຕ້ອງສັງເກດ, Assistant ກໍ່ບໍ່ສາມາດປະດິດຜົນການຕອບກັບຂອງ Tool ໄດ້!
  - ສຳຄັນ: ສຳລັບຄຳສັ່ງປະເພດຊື້ຂອງ (ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້, ຕ້ອງສ້າງຄຳສັ່ງຊື້), ຕ້ອງຢືນຢັນວ່າ assistant ໄດ້ສຳເລັດການດຳເນີນການສັ່ງຊື້ແທ້ຫຼືບໍ່. ມັນອາດຈະເປັນໄປໄດ້ທີ່ assistant ເຂົ້າໃຈຜິດວ່າໄດ້ສຳເລັດການສັ່ງຊື້, ແຕ່ຕົວຈິງແລ້ວການເອີ້ນໃຊ້ເຄື່ອງມືລົ້ມເຫຼວ; ຫຼື user ສະແດງວ່າສາມາດ "ສັ່ງຊື້ເອງໄດ້" ແລະ ອື່ນໆ, ຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບຄຳສັ່ງຂອງຜູ້ໃຊ້ທີ່ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້ ເຊັ່ນ ຈຳນວນສິນຄ້າ, ເວລາສົ່ງ, ຕ້ອງຕອບສະໜອງຄວາມຕ້ອງການຂອງຄຳສັ່ງຜູ້ໃຊ້ເດີມຢ່າງເຂັ້ມງວດ (ບໍ່ສາມາດມີຄວາມຜິດພາດຈຳນວນສິນຄ້າ, ບໍ່ສາມາດຊ້າກວ່າເວລາສົ່ງທີ່ຄາດຫວັງ), ການປະນີປະນອມຂອງຜູ້ໃຊ້ບໍ່ສົ່ງຜົນຕໍ່ຜົນການຕັດສິນ (ຕົວຢ່າງເຊັ່ນ user ບອກວ່າ "ສິນຄ້າບາງຢ່າງໜ້ອຍກໍ່ໄດ້", "ບໍ່ມີຄຳຄັດຄ້ານຕໍ່ເນື້ອຫາຄຳສັ່ງຊື້" ຫຼື "ສົ່ງຊ້າກໍ່ໄດ້" ແລະ ອື່ນໆ), ສະຖານະການແບບນີ້ຍັງຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບຄຳສັ່ງຂອງຜູ້ໃຊ້ປະເພດທີ່ກ່ຽວຂ້ອງກັບການຈັບຄູ່ເນື້ອຫາຂໍ້ຄວາມເຊັ່ນ ທີ່ຢູ່ ຫຼື ຫມາຍເຫດຄຳສັ່ງຊື້, ໃຊ້ຫຼັກການເທົ່າທຽມກັນດ້ານຟັງຊັນ: ຖ້າເນື້ອຫາຕົວຈິງສາມາດບັນລຸຟັງຊັນດຽວກັນໄດ້ (ເຊັ່ນ ກຳນົດຕຳແໜ່ງຈັດສົ່ງໂດຍປະມານ ຫຼື ສົ່ງຕໍ່ຄວາມຕ້ອງການຫຼັກຂອງລູກຄ້າ), ເຖິງແມ່ນວ່າການສະແດງອອກຈະບໍ່ຄືກັນຢ່າງສົມບູນ ຫຼື ຂາດລາຍລະອຽດບາງສ່ວນ, ກໍ່ຖືວ່າຕອບສະໜອງຄວາມຕ້ອງການ
  - ແຍກຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້ອອກເປັນສ່ວນໆຢ່າງເໝາະສົມ, ແລະ ປະເມີນວ່າແຕ່ລະຄວາມຕ້ອງການຍ່ອຍໄດ້ຖືກຕອບສະໜອງຫຼືບໍ່:
    - ຖ້າປ່ອງຢ້ຽມ ປະຈຸບັນບໍ່ກ່ຽວຂ້ອງກັບຄວາມຕ້ອງການຍ່ອຍໃດໜຶ່ງ, ກໍ່ບັນທຶກວ່າປະຈຸບັນບໍ່ກ່ຽວຂ້ອງ;
    - ຖ້າປ່ອງຢ້ຽມ ປະຈຸບັນກ່ຽວຂ້ອງກັບຄວາມຕ້ອງການຍ່ອຍໃດໜຶ່ງແຕ່ບໍ່ສາມາດຕັດສິນໄດ້ຢ່າງສົມບູນ, ກໍ່ບັນທຶກຂໍ້ມູນສຳຄັນໃນ memory ເພື່ອລໍຖ້າການຕັດສິນໃນພາຍຫຼັງ
    - ບັນທຶກຂໍ້ມູນສຳຄັນທີ່ກ່ຽວຂ້ອງກັບຄວາມຕ້ອງການຍ່ອຍ ແລະ ຮອບທີ່ກົງກັນ [x] ໃນ memory, ເພື່ອໃຫ້ປ່ອງຢ້ຽມ ຕໍ່ໄປສາມາດຕັດສິນໄດ້ຕໍ່

  # ຄວາມຕ້ອງການຮູບແບບ
  - ການຕອບກັບຂອງທ່ານຄວນເປັນວັດຖຸ JSON, ປະກອບມີຟີລດັ່ງຕໍ່ໄປນີ້:
  - `justification`: ຄຳອະທິບາຍສັ້ນໆກ່ຽວກັບຜົນການປະເມີນ
  - `meetExpectation`: ຜົນການປະເມີນ (true ຫຼື false)

  # ໂຄງສ້າງຕົວຢ່າງການປ້ອນຂໍ້ມູນ:
  <window_content>xxx</window_content>
  <memory>xxx</memory>
  <current_evaluation>xxx</current_evaluation>

  # ໂຄງສ້າງຕົວຢ່າງການຕອບກັບ:
  ```json
  {{
      "memory": <ບົດສະຫຼຸບຂອງຂໍ້ມູນປ່ອງຢ້ຽມກ່ອນໜ້າ>,
      "justification": "<ຄຳອະທິບາຍສັ້ນໆກ່ຽວກັບຜົນການປະເມີນ>",
      "meetExpectation": <true or false>
  }}
  ```
tamil: |-
  # அமைப்பு தகவல்
  {env_info}

  # பயனரின் முழுமையான வழிமுறை
  {user_instruction}

  # பின்னணி விளக்கம்
  - இது பயனர் மற்றும் உதவியாளருக்கு இடையேயான உரையாடல் காட்சியாகும், இதில் உதவியாளர் தகவலைப் பெறவும் செயல்பாடுகளை முடிக்கவும் கருவிகளை அழைக்கலாம், கருவி திரும்பும் முடிவுகள் tool என்று தொடங்கும்
  - பயனர் வழிமுறை நிறைவேற்றப்பட்டதா என நீங்கள் மதிப்பிட வேண்டும்
  - உரையாடல் சுற்றுகள் அதிகமாக இருப்பதால், நாங்கள் sliding window மதிப்பீட்டு முறையைப் பயன்படுத்துகிறோம், அதாவது ஒவ்வொரு முறையும் 10 உரையாடல் சுற்றுகள் தெரியும், ஒவ்வொரு சாளரத்திற்கும் இடையில் 2 உரையாடல் சுற்றுகள் ஒன்றுபட்டிருக்கும்
  - நீங்கள் {window_idx} வது சாளரத்தை மதிப்பிடுகிறீர்கள் (இந்த பணிக்காக மொத்தம் {total_windows} சாளரங்கள்)
  - <window_content> தற்போதைய சாளரத்தின் உரையாடல் உள்ளடக்கத்தைக் கொண்டுள்ளது
  - <memory> முந்தைய சாளர தகவல்களின் நினைவக சுருக்கத்தைக் கொண்டுள்ளது
  - <current_evaluation> முந்தைய சாளரங்களின் மதிப்பீட்டு முடிவுகளைக் கொண்டுள்ளது

  # பணி
  - தற்போதைய சாளரத்தின் உரையாடல் உள்ளடக்கத்தின் அடிப்படையில், பயனரின் முழுமையான வழிமுறையில் உள்ள தேவைகள் அனைத்தும் பூர்த்தி செய்யப்பட்டதா என தீர்மானிக்கவும்
  - உதவியாளர் இந்த சாளரம் மற்றும் வரலாற்று சாளரங்களில் பயனரின் முழுமையான வழிமுறையை முடித்தால் மட்டுமே, நீங்கள் நிலையை false இருந்து true ஆக புதுப்பிக்கலாம்
  - உதவியாளர் இந்த சாளரத்தில் முந்தைய சரியான முடிவை மாற்றினால் மட்டுமே, நீங்கள் true ஐ மீண்டும் false ஆக புதுப்பிக்கலாம் (ஆனால் கவனிக்கவும்: பயனர் தேவைகளே மாறினால், உதாரணமாக ஆர்டர் செய்த பிறகு சுயமாக ரத்து செய்தால், ஆர்டர் தேவைக்கான அசல் மதிப்பீட்டை மாற்றக்கூடாது)
  - தேவையற்ற மாற்றங்களைத் தவிர்க்க, தற்போதைய உரையாடல் சாளரத்தின் முன்னேற்றத்தைப் பெற "பயனரின் முழுமையான வழிமுறை" ஐ நீங்கள் குறிக்கலாம்
  - தற்போதைய சாளர உள்ளடக்கம் <window_content> மற்றும் நினைவக சுருக்க உள்ளடக்கம் <memory> ஆகியவற்றை இணைத்து, எச்சரிக்கைகளில் உள்ள விதிகளின்படி memory உள்ளடக்கத்தை சரிசெய்த பிறகு புதிய <memory> ஆக வெளியிடவும்

  # எச்சரிக்கைகள்
  - முக்கியம்: அனைத்து மதிப்பீடுகளும் உதவியாளரின் பதில் மற்றும் கருவி அழைப்பு கோரிக்கைகள் பயனர் வழிமுறையை நிறைவேற்றியதா என்பதை அடிப்படையாகக் கொண்டது, உரையாடலில் பயனர் வெளிப்படுத்தும் உள்ளடக்கம் உதவியாளருக்கான குறிப்பு மற்றும் வழிகாட்டலாக மட்டுமே கருதப்படும், இது மதிப்பீட்டு நிலைகளை நேரடியாக பாதிக்காது, அனைத்தும் பயனர் வழிமுறையை அடிப்படையாகக் கொண்டது!
  - முக்கியம்: விசாரணை வகை tool திரும்பும் முடிவுகள் உதவியாளருக்கு மட்டுமே தெரியும், இது பயனருக்கு உதவியாளர் பரிந்துரைக்கும் உள்ளடக்கத்தை குறிக்காது, எனவே இது மதிப்பீட்டு முடிவுகளையும் நேரடியாக பாதிக்காது, அனைத்தும் உதவியாளர் தகவலைப் பெற்ற பிறகு பயனருக்கு அளிக்கும் பதிலை அடிப்படையாகக் கொண்டது! அதே நேரத்தில், உதவியாளர் Tool இன் திரும்பும் முடிவுகளை உருவாக்கக்கூடாது என்பதையும் கவனிக்க வேண்டும்!
  - முக்கியம்: வாங்குதல் வகை வழிமுறைகளுக்கு (ஆர்டர் விவரங்களை உள்ளடக்கியது, ஆர்டரை உருவாக்க வேண்டியது), உதவியாளர் உண்மையில் ஆர்டர் செயல்பாட்டை முடித்தாரா என்பதை உறுதிப்படுத்த வேண்டும். உதவியாளர் ஆர்டர் செயல்பாட்டை முடித்ததாக தவறாக நினைக்கலாம், உண்மையில் கருவி அழைப்பு தோல்வியடைந்திருக்கலாம்; அல்லது பயனர் "தானே ஆர்டர் செய்யலாம்" என்று கூறும் நிலைகள் போன்றவை, அனைத்தும் தேவைகள் பூர்த்தி செய்யப்படவில்லை என கருதப்பட வேண்டும்
  - பொருள் அளவு, டெலிவரி நேரம் போன்ற ஆர்டர் விவரங்களை உள்ளடக்கிய பயனர் வழிமுறைகளுக்கு, அசல் பயனர் வழிமுறை தேவைகள் கண்டிப்பாக பூர்த்தி செய்யப்பட வேண்டும் (பொருள் அளவில் வேறுபாடு இருக்கக்கூடாது, எதிர்பார்க்கப்படும் டெலிவரி நேரத்தை விட தாமதமாக இருக்கக்கூடாது), பயனர் சமரசம் செய்வது மதிப்பீட்டு முடிவை பாதிக்காது (உதாரணமாக பயனர் "சில பொருட்கள் குறைவாக இருந்தாலும் பரவாயில்லை", "ஆர்டர் உள்ளடக்கத்தில் எந்த ஆட்சேபனையும் இல்லை" அல்லது "தாமதமாக டெலிவரி செய்தாலும் பரவாயில்லை" என்று கூறுவது போன்றவை), இத்தகைய நிலைகள் இன்னும் தேவைகள் பூர்த்தி செய்யப்படவில்லை என கருதப்பட வேண்டும்
  - உரை உள்ளடக்க பொருத்தமான முகவரி அல்லது ஆர்டர் குறிப்பு வகை பயனர் வழிமுறைகளுக்கு, செயல்பாட்டு சமநிலை கொள்கையைப் பயன்படுத்தவும்: உண்மையான உள்ளடக்கம் அதே செயல்பாட்டைச் செய்ய முடிந்தால் (டெலிவரி இடத்தை தோராயமாக இடம்பெறுத்தல் அல்லது வாடிக்கையாளரின் முதன்மை தேவைகளை தெரிவித்தல் போன்றவை), கூற்று முழுமையாக ஒத்துப்போகாவிட்டாலும் அல்லது சில விவரங்கள் காணாமல் போனாலும், தேவைகள் பூர்த்தி செய்யப்பட்டதாக கருதப்படும்
  - பயனரின் முழுமையான வழிமுறையை பொருத்தமாக பிரித்து, ஒவ்வொரு துணை தேவையும் பூர்த்தி செய்யப்பட்டதா என மதிப்பிடவும்:
    - தற்போதைய சாளரம் ஒரு குறிப்பிட்ட துணை தேவையை உள்ளடக்கவில்லை என்றால், தற்போது உள்ளடக்கப்படவில்லை என பதிவு செய்யவும்;
    - தற்போதைய சாளரம் ஒரு குறிப்பிட்ட துணை தேவையை உள்ளடக்கியது ஆனால் முழுமையாக தீர்மானிக்க முடியவில்லை என்றால், முக்கிய தகவலை memory இல் பதிவு செய்து பின்னர் தீர்மானிக்க வைக்கவும்
    - பின்னர் சாளரங்கள் தொடர்ந்து தீர்மானிக்க, memory இல் துணை தேவைகளுடன் தொடர்புடைய முக்கிய தகவல் மற்றும் அதற்கான சுற்று [x] ஆகியவற்றை பதிவு செய்யவும்

  # வடிவமைப்பு தேவைகள்
  - உங்கள் பதில் ஒரு JSON பொருளாக இருக்க வேண்டும், பின்வரும் புலங்களைக் கொண்டிருக்க வேண்டும்:
  - `justification`: மதிப்பீட்டு முடிவுக்கான சுருக்கமான விளக்கம்
  - `meetExpectation`: மதிப்பீட்டு முடிவு (true அல்லது false)

  # மாதிரி உள்ளீட்டு கட்டமைப்பு:
  <window_content>xxx</window_content>
  <memory>xxx</memory>
  <current_evaluation>xxx</current_evaluation>

  # மாதிரி பதில் கட்டமைப்பு:
  ```json
  {{
      "memory": <முந்தைய சாளர தகவல்களின் சுருக்கம்>,
      "justification": "<மதிப்பீட்டு முடிவுக்கான சுருக்கமான விளக்கம்>",
      "meetExpectation": <true or false>
  }}
  ```
