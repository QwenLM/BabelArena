  # పని
  - ప్రస్తుత విండో యొక్క సంభాషణ కంటెంట్ ఆధారంగా, వినియోగదారు పూర్తి సూచనలోని అవసరాలు అన్నీ నెరవేరాయో లేదో నిర్ణయించండి
  - అసిస్టెంట్ ఈ విండో మరియు చరిత్ర విండోలలో వినియోగదారు పూర్తి సూచనను పూర్తి చేసినప్పుడు మాత్రమే మీరు స్థితిని false నుండి true కు నవీకరించవచ్చు
  - అసిస్టెంట్ ఈ విండోలో మునుపటి సరైన నిర్ధారణను తిరస్కరించినప్పుడు మాత్రమే మీరు true ను మళ్లీ false కు నవీకరించవచ్చు (కానీ గమనించండి: వినియోగదారు అవసరాలు స్వయంగా మారినట్లయితే, ఉదాహరణకు ఆర్డర్ చేసిన తర్వాత స్వయంగా రద్దు చేసుకోవడం, అప్పుడు ఆర్డర్ అవసరం యొక్క అసలు అంచనాను తిరస్కరించకూడదు)
  - అనవసరమైన మార్పులను నివారించడానికి, ప్రస్తుత సంభాషణ విండో యొక్క పురోగతిని పొందడానికి మీరు "వినియోగదారు పూర్తి సూచన"ను సూచించవచ్చు
  - ప్రస్తుత విండో కంటెంట్ <window_content> మరియు మెమరీ సారాంశ కంటెంట్ <memory>ను విలీనం చేసి, నోట్లలోని నియమాల ప్రకారం memory కంటెంట్‌ను సర్దుబాటు చేసిన తర్వాత కొత్త <memory>గా అవుట్‌పుట్ చేయండి

  # గమనికలు
  - ముఖ్యం: అన్ని అంచనాలు అసిస్టెంట్ యొక్క సమాధానం మరియు సాధనం పిలుపు అభ్యర్థన వినియోగదారు సూచనను పూర్తి చేసిందో లేదో దానిపై ఆధారపడి ఉంటాయి, సంభాషణలో వినియోగదారు వ్యక్తపరిచిన కంటెంట్ కేవలం అసిస్టెంట్ కోసం సూచన మరియు మార్గదర్శకంగా పరిగణించబడుతుంది, అంచనా ప్రమాణాలను నేరుగా ప్రభావితం చేయదు, అన్నీ వినియోగదారు సూచన ప్రకారం ఉంటాయి!
  - ముఖ్యం: క్వెరీ రకం tool తిరిగి ఇచ్చే ఫలితాలు కేవలం అసిస్టెంట్‌కు కనిపిస్తాయి, ఇది వినియోగదారుకు అసిస్టెంట్ సిఫార్సు చేసిన కంటెంట్‌ను సూచించదు, కాబట్టి ఇది అంచనా ఫలితాలను నేరుగా ప్రభావితం చేయదు, అన్నీ అసిస్టెంట్ సమాచారాన్ని పొందిన తర్వాత వినియోగదారుకు ఇచ్చే సమాధానం ప్రకారం ఉండాలి! అదే సమయంలో, అసిస్టెంట్ Tool యొక్క తిరిగి వచ్చే ఫలితాలను కల్పించకూడదు అని గమనించాలి!
  - ముఖ్యం: కొనుగోలు రకం సూచనల కోసం (ఆర్డర్ వివరాలను కలిగి ఉంటుంది, ఆర్డర్‌ను సృష్టించాల్సిన అవసరం ఉంటుంది), అసిస్టెంట్ వాస్తవానికి ఆర్డర్ చేసే పనిని పూర్తి చేసిందో లేదో నిర్ధారించుకోవాలి. అసిస్టెంట్ ఆర్డర్ చేసే పనిని పూర్తి చేసిందని తప్పుగా భావించే అవకాశం ఉంది, వాస్తవానికి సాధనం పిలుపు విఫలమైంది; లేదా వినియోగదారు "తానే ఆర్డర్ చేసుకోవచ్చు" అని సూచించిన సందర్భాలు, అన్నీ అవసరాలు నెరవేరలేదని పరిగణించాలి
  - వస్తువుల సంఖ్య, డెలివరీ సమయం వంటి ఆర్డర్ వివరాలను కలిగి ఉన్న వినియోగదారు సూచనల కోసం, అసలు వినియోగదారు సూచన అవసరాలను కచ్చితంగా సంతృప్తి పరచాలి (వస్తువుల సంఖ్యలో వ్యత్యాసం ఉండకూడదు, అనుకున్న డెలివరీ సమయం కంటే ఆలస్యం కాకూడదు), వినియోగదారు రాజీ పడటం అంచనా ఫలితాన్ని ప్రభావితం చేయదు (ఉదాహరణకు వినియోగదారు "కొన్ని వస్తువులు తక్కువగా ఉన్నా పర్లేదు", "ఆర్డర్ కంటెంట్‌పై అభ్యంతరం లేదు" లేదా "కొంచెం ఆలస్యంగా డెలివరీ అయినా పర్లేదు" అని సూచించినప్పుడు), అటువంటి సందర్భాలు ఇప్పటికీ అవసరాలు నెరవేరలేదని పరిగణించాలి
  - టెక్స్ట్ కంటెంట్ మ్యాచింగ్ చిరునామా లేదా ఆర్డర్ నోట్స్ రకం వినియోగదారు సూచనల కోసం, ఫంక్షనల్ ఈక్వివలెన్స్ సూత్రాన్ని ఉపయోగించండి: వాస్తవ కంటెంట్ ఒకే ఫంక్షన్‌ను అమలు చేయగలిగినంత వరకు (ఉదాహరణకు డెలివరీ స్థలాన్ని సుమారుగా గుర్తించడం లేదా కస్టమర్ యొక్క ప్రధాన అవసరాలను తెలియజేయడం), వ్యక్తీకరణ పూర్తిగా సమానంగా లేకపోయినా లేదా కొన్ని వివరాలు లేకపోయినా, అవసరాలు నెరవేరాయని పరిగణించాలి
  - వినియోగదారు పూర్తి సూచనను సరిగ్గా విభజించండి, మరియు ప్రతి ఉప-అవసరం నెరవేరిందో లేదో అంచనా వేయండి:
    - ప్రస్తుత విండోలో ఏదైనా ఉప-అవసరం ఉండకపోతే, ప్రస్తుతం అది లేదని నమోదు చేయండి;
    - ప్రస్తుత విండోలో ఏదైనా ఉప-అవసరం ఉంది కానీ పూర్తిగా నిర్ణయించలేకపోతే, కీలక సమాచారాన్ని తర్వాతి నిర్ణయం కోసం memoryలో నమోదు చేయండి
    - తర్వాతి విండోలు కొనసాగించి నిర్ణయించడానికి, memoryలో ఉప-అవసరానికి సంబంధించిన కీలక సమాచారం మరియు దానికి అనుగుణంగా ఉన్న చుట్టు [x] నమోదు చేయండి

  # ఫార్మాట్ అవసరాలు
  - మీ సమాధానం ఒక JSON ఆబ్జెక్ట్‌గా ఉండాలి, ఇది క్రింది ఫీల్డ్‌లను కలిగి ఉంటుంది:
  - `justification`: అంచనా ఫలితానికి సంక్షిప్త వివరణ
  - `meetExpectation`: అంచనా ఫలితం (true లేదా false)

  # ఉదాహరణ ఇన్‌పుట్ నిర్మాణం:
  <window_content>xxx</window_content>
  <memory>xxx</memory>
  <current_evaluation>xxx</current_evaluation>

  # ఉదాహరణ సమాధాన నిర్మాణం:
  ```json
  {{
      "memory": <మునుపటి విండో సమాచారం యొక్క సారాంశ>,
      "justification": "<అంచనా ఫలితానికి సంక్షిప్త వివరణ>",
      "meetExpectation": <true లేదా false>
  }}
  ```
