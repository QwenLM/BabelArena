  - នេះគឺជាស្ថានភាពសន្ទនារវាង user និង assistant ដែលក្នុងនោះ assistant អាចហៅឧបករណ៍ដើម្បីទទួលបានព័ត៌មាន និងអនុវត្តប្រតិបត្តិការ លទ្ធផលដែលត្រឡប់មកវិញពីឧបករណ៍នឹងចាប់ផ្តើមដោយ tool
  - អ្នកត្រូវវាយតម្លៃថាតើការណែនាំរបស់អ្នកប្រើប្រាស់ត្រូវបានបំពេញឬអត់
  - ដោយសារតែមានវគ្គសន្ទនាច្រើន យើងប្រើប្រាស់វិធីសាស្ត្រវាយតម្លៃបង្អួចរអិល គឺនៅពេលណាមួយអាចមើលឃើញ ១០ វគ្គសន្ទនា រវាងបង្អួចនីមួយៗមាន ២ វគ្គសន្ទនាត្រួតគ្នា
  - អ្នកកំពុងវាយតម្លៃបង្អួចទី {window_idx} (ភារកិច្ចនេះមានសរុប {total_windows} បង្អួច)
  - <window_content> មានមាតិកាសន្ទនានៃបង្អួចបច្ចុប្បន្ន
  - <memory> មានសេចក្តីសង្ខេបការចងចាំនៃព័ត៌មានបង្អួចមុនៗ
  - <current_evaluation> មានលទ្ធផលការវាយតម្លៃនៃបង្អួចមុនៗ

  # ភារកិច្ច
  - ផ្អែកលើមាតិកាសន្ទនានៃបង្អួចបច្ចុប្បន្ន ចូរវិនិច្ឆ័យថាតើតម្រូវការនៅក្នុងការណែនាំពេញលេញរបស់អ្នកប្រើប្រាស់ត្រូវបានបំពេញទាំងអស់ឬអត់
  - អ្នកអាចផ្លាស់ប្តូរស្ថានភាពពី false ទៅ true លុះត្រាតែ assistant បានបំពេញការណែនាំពេញលេញរបស់អ្នកប្រើប្រាស់នៅក្នុងបង្អួចនេះ និងបង្អួចប្រវត្តិ
  - អ្នកក៏អាចផ្លាស់ប្តូរ true ទៅ false ម្តងទៀត លុះត្រាតែ assistant បានបដិសេធការសន្និដ្ឋានត្រឹមត្រូវមុនៗនៅក្នុងបង្អួចនេះ (ប៉ុន្តែសូមកត់សម្គាល់៖ ប្រសិនបើតម្រូវការរបស់អ្នកប្រើប្រាស់ផ្ទាល់មានការផ្លាស់ប្តូរ ឧទាហរណ៍ដាក់បញ្ជាទិញរួចហើយបោះបង់ចោលដោយស្ម័គ្រចិត្ត នោះមិនគួរលុបចោលការវាយតម្លៃដើមចំពោះតម្រូវការដាក់បញ្ជាទិញនោះទេ)
  - អ្នកអាចយោងតាម“ការណែនាំពេញលេញពីអ្នកប្រើប្រាស់”ដើម្បីទទួលបានវឌ្ឍនភាពនៃបង្អួចសន្ទនាបច្ចុប្បន្ន ជៀសវាងការកែប្រែដែលមិនចាំបាច់
  - បញ្ចូលមាតិកាបង្អួចបច្ចុប្បន្ន <window_content> និងមាតិកាសង្ខេបការចងចាំ <memory> ហើយបន្ទាប់ពីកែតម្រូវមាតិកា memory តាមវិធានក្នុងចំណុចគួរកត់សម្គាល់ ចូរចេញជា <memory> ថ្មី

  # ចំណុចគួរកត់សម្គាល់
  - សំខាន់៖ ការវាយតម្លៃទាំងអស់ផ្អែកលើការឆ្លើយតបរបស់ assistant និងការស្នើសុំហៅឧបករណ៍ថាតើបានបំពេញការណែនាំរបស់អ្នកប្រើប្រាស់ឬអត់ មាតិកាដែល user បង្ហាញនៅក្នុងសន្ទនាគ្រាន់តែចាត់ទុកជាការរំលឹក និងណែនាំចំពោះ assistant នឹងមិនប៉ះពាល់ដោយផ្ទាល់ដល់ស្តង់ដារការវាយតម្លៃនោះទេ អ្វីៗត្រូវផ្អែកលើការណែនាំរបស់អ្នកប្រើប្រាស់!
  - សំខាន់៖ លទ្ធផលដែលត្រឡប់មកវិញពី tool ប្រភេទស្វែងរក គឺមើលឃើញតែចំពោះ assistant ប៉ុណ្ណោះ មិនមែនតំណាងឱ្យមាតិកាដែល assistant ណែនាំដល់អ្នកប្រើប្រាស់នោះទេ ដូច្នេះវាក៏មិនប៉ះពាល់ដោយផ្ទាល់ដល់លទ្ធផលការវាយតម្លៃដែរ អ្វីៗត្រូវផ្អែកលើការឆ្លើយតបរបស់ assistant ទៅកាន់អ្នកប្រើប្រាស់បន្ទាប់ពីទទួលបានព័ត៌មាន! ក្នុងពេលតែមួយត្រូវកត់សម្គាល់ថា Assistant ក៏មិនអាចបង្កើតលទ្ធផលត្រឡប់មកវិញរបស់ Tool បានដែរ!
  - សំខាន់៖ ចំពោះការណែនាំប្រភេទទិញ (ពាក់ព័ន្ធនឹងលម្អិតបញ្ជាទិញ ត្រូវតែបង្កើតបញ្ជាទិញ) ត្រូវតែបញ្ជាក់ថាតើ assistant បានបំពេញប្រតិបត្តិការដាក់បញ្ជាទិញជាក់ស្តែងឬអត់។ វាអាចកើតឡើងដែល assistant យល់ច្រឡំថាបានបំពេញប្រតិបត្តិការដាក់បញ្ជាទិញហើយ តែការពិតការហៅឧបករណ៍បានបរាជ័យ; ឬ user បង្ហាញថាអាច“ដាក់បញ្ជាទិញដោយខ្លួនឯងបាន”ជាដើម គួរតែចាត់ទុកថាមិនបានបំពេញតម្រូវការ
  - ចំពោះការណែនាំរបស់អ្នកប្រើប្រាស់ដែលពាក់ព័ន្ធនឹងលម្អិតបញ្ជាទិញដូចជា ចំនួនទំនិញ ពេលវេលាដឹកជញ្ជូន ត្រូវតែបំពេញតាមតម្រូវការការណែនាំរបស់អ្នកប្រើប្រាស់ដើមឱ្យបានតឹងរ៉ឹង (មិនអាចមានគម្លាតចំនួនទំនិញ មិនអាចយឺតជាងពេលវេលាដឹកជញ្ជូនដែលរំពឹងទុក) អាកប្បកិរិយាសម្របសម្រួលរបស់អ្នកប្រើប្រាស់មិនប៉ះពាល់ដល់លទ្ធផលការវិនិច្ឆ័យទេ (ឧទាហរណ៍ user បង្ហាញថា“ទំនិញណាមួយសល់តិចក៏បាន”、“មិនមានចំណុចខ្វះខាតចំពោះមាតិកាបញ្ជាទិញ”ឬ“ដឹកជញ្ជូនយឺតបន្តិចក៏បាន”ជាដើម) ស្ថានភាពបែបនេះនៅតែគួរតែចាត់ទុកថាមិនបានបំពេញតម្រូវការ
  - ចំពោះការណែនាំរបស់អ្នកប្រើប្រាស់ប្រភេទអាសយដ្ឋាន ឬកំណត់ត្រាបញ្ជាទិញដែលពាក់ព័ន្ធនឹងការផ្គូផ្គងមាតិកាអត្ថបទ អនុវត្តតាមគោលការណ៍សមមូលមុខងារ៖ ត្រឹមតែមាតិកាជាក់ស្តែងអាចសម្រេចបាននូវមុខងារដូចគ្នា (ដូចជាការកំណត់ទីតាំងដឹកជញ្ជូនប្រហាក់ប្រហែល ឬបញ្ជូនតម្រូវការចម្បងរបស់អតិថិជន) ទោះបីជាពាក្យសម្តីមិនដូចគ្នាពេញលេញ ឬខ្វះលម្អិតខ្លះក៏ដោយ ក៏ចាត់ទុកថាបានបំពេញតម្រូវការដែរ
  - បំបែកការណែនាំពេញលេញរបស់អ្នកប្រើប្រាស់ឱ្យបានសមស្រប ហើយវាយតម្លៃថាតើតម្រូវការរងនីមួយៗត្រូវបានបំពេញឬអត់៖
    - ប្រសិនបើបង្អួចបច្ចុប្បន្នមិនពាក់ព័ន្ធនឹងតម្រូវការរងណាមួយ នោះត្រូវកត់ត្រាថាបច្ចុប្បន្នមិនបានពាក់ព័ន្ធ;
    - ប្រសិនបើបង្អួចបច្ចុប្បន្នពាក់ព័ន្ធនឹងតម្រូវការរងណាមួយប៉ុន្តែមិនអាចសម្រេចចិត្តបានពេញលេញ នោះត្រូវកត់ត្រាព័ត៌មានសំខាន់ក្នុង memory ទុកសម្រាប់ការវិនិច្ឆ័យនៅពេលក្រោយ
    - កត់ត្រាព័ត៌មានសំខាន់ដែលទាក់ទងនឹងតម្រូវការរង និងវគ្គដែលត្រូវគ្នា [x] ក្នុង memory ដើម្បីងាយស្រួលដល់ការវិនិច្ឆ័យបន្តនៅបង្អួចបន្ទាប់

  # តម្រូវការទម្រង់
  - ការឆ្លើយតបរបស់អ្នកគួរតែជាវត្ថុ JSON មួយ មានវាលដូចខាងក្រោម៖
  - `justification`៖ ការពន្យល់សង្ខេបអំពីលទ្ធផលការវាយតម្លៃ
  - `meetExpectation`៖ លទ្ធផលការវាយតម្លៃ (true ឬ false)

  # រចនាសម្ព័ន្ធបញ្ចូលឧទាហរណ៍៖
  <window_content>xxx</window_content>
  <memory>xxx</memory>
  <current_evaluation>xxx</current_evaluation>

