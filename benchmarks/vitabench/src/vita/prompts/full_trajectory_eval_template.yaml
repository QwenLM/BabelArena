  - Маңызды: Тапсырыс түріндегі критерийлер үшін (тапсырыс детальдарын қамтитын, тапсырыс жасау міндетті түрде қажет), ассистенттің тапсырыс жасау әрекетін шынымен орындағанын растау қажет. Ассистент тапсырыс жасалды деп қате түсінуі мүмкін, шын мәнінде құрал шақыруы сәтсіз аяқталуы мүмкін; немесе пайдаланушы «өзім тапсырыс бере аламын» деп айтуы мүмкін; мұндай жағдайлардың барлығы талап орындалмаған деп саналады
  - Тауар саны, жеткізу уақыты сияқты тапсырыс детальдарын қамтитын критерийлер үшін бастапқы критерий (rubric) талаптары қатаң орындалуы керек (тауар санында ауытқу болмауы керек, күтілген жеткізу уақытынан кешіктірілмеуі керек), пайдаланушының келісімге келу әрекеті бағалау нәтижесіне әсер етпейді (мысалы, пайдаланушы «кейбір тауарлар аз болса да болады», «тапсырыс мазмұнына қарсы емеспін» немесе «кешірек жеткізілсе де болады» деп айтса), мұндай жағдайлар әлі де талап орындалмаған деп саналуы керек
  - Мәтін мазмұны сәйкестігін қамтитын мекенжай немесе тапсырыс ескертпелері түріндегі критерийлер үшін функционалды балама принципі қолданылады: егер нақты мазмұн бірдей функцияны орындаса (мысалы, жеткізу орнын шамамен анықтау немесе тұтынушының негізгі қажеттіліктерін жеткізу), тіпті тұжырымдама толық сәйкес келмесе немесе кейбір детальдар жоқ болса да, талап орындалған деп саналады
  - justification өрісінде ағымдағы критерийге (rubric) қатысты негізгі ақпарат пен оған сәйкес келетін кезеңді [x] қосу түрінде жазыңыз, егер күй өзгерсе, себепті де жазу қажет, қысқа әрі нұсқа тілді қолданыңыз

  # Пішім талаптары
  - Сіздің жауабыңыз JSON объектісі болуы керек, келесі өрістерді қамтиды:
  - `rubric_idx`: Ереженің бірегей идентификаторы
  - `rubric`: Ереженің қайталануы
  - `justification`: Күй өзгерісінің түсіндірмесі
  - `meetExpectation`: Жаңартылған күй (true немесе false)

  # Үлгі кіріс құрылымы:
  <trajectory_content>xxx</trajectory_content>
  <current_rubrics>xxx</current_rubrics>

  # Үлгі жауап құрылымы:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<Ережені қайталау>",
        "justification": "<Күй өзгерісінің қысқаша түсіндірмесі, қосу түрінде жазылады>",
        "meetExpectation": <true or false>
    }},
    ...
  ]
  ```
khmer: |-
  # ព័ត៌មានប្រព័ន្ធ
  {env_info}

  # ការណែនាំពេញលេញពីអ្នកប្រើប្រាស់
  {user_instruction}

  # ការពន្យល់ផ្ទៃខាងក្រោយ
  - នេះគឺជាឆាកនៃការសន្ទនារវាងអ្នកប្រើប្រាស់ (user) និងជំនួយការ (assistant) ដែលជំនួយការអាចហៅឧបករណ៍ (tool) ដើម្បីទទួលបានព័ត៌មាន និងអនុវត្តប្រតិបត្តិការ លទ្ធផលដែលត្រឡប់មកពីឧបករណ៍នឹងចាប់ផ្តើមដោយ tool
  - អ្នកត្រូវវាយតម្លៃថាតើការណែនាំពីអ្នកប្រើប្រាស់ត្រូវបានបំពេញឬអត់ ការណែនាំពេញលេញពីអ្នកប្រើប្រាស់ត្រូវបានបំបែកជាចំណុចផ្តល់ពិន្ទុ (rubric) ជាច្រើន អ្នកគ្រាន់តែត្រូវវិនិច្ឆ័យថាតើចំណុចផ្តល់ពិន្ទុនីមួយៗត្រូវបានបំពេញឬអត់
  - <trajectory_content> មានផ្ទុកនូវខ្លឹមសារនៃការសន្ទនាពេញលេញរវាងអ្នកប្រើប្រាស់ និងជំនួយការ
  - <current_rubrics> មានផ្ទុកនូវស្ថានភាពនៃចំណុចផ្តល់ពិន្ទុទាំងអស់នៅបច្ចុប្បន្ន (true មានន័យថាបានបំពេញ, false មានន័យថាមិនបានបំពេញ, ស្ថានភាពដើមនៃចំណុចផ្តល់ពិន្ទុទាំងអស់គឺ false)

  # ភារកិច្ច
  - ផ្អែកលើខ្លឹមសារនៃការសន្ទនា ធ្វើបច្ចុប្បន្នភាពស្ថានភាពនៃចំណុចផ្តល់ពិន្ទុ (rubric)
  - អ្នកអាចផ្លាស់ប្តូរស្ថានភាពពី false ទៅ true លុះត្រាតែជំនួយការបានបំពេញគោលដៅនោះក្នុងការសន្ទនា

  # ចំណុចគួរកត់សម្គាល់
  - សំខាន់៖ ការវាយតម្លៃទាំងអស់ផ្អែកលើការឆ្លើយតបរបស់ជំនួយការ និងការហៅឧបករណ៍ថាតើបានបំពេញគោលដៅក្នុង rubric ឬអត់ ខ្លឹមសារដែលអ្នកប្រើប្រាស់បង្ហាញក្នុងការសន្ទនាគ្រាន់តែចាត់ទុកជាគន្លឹះ និងការណែនាំដល់ជំនួយការ វានឹងមិនប៉ះពាល់ដោយផ្ទាល់ដល់ស្តង់ដារវាយតម្លៃឡើយ អ្វីៗទាំងអស់ត្រូវផ្អែកលើវាល rubric!
  - សំខាន់៖ លទ្ធផលដែលត្រឡប់មកពីឧបករណ៍ប្រភេទស្វែងរក (query tool) គឺមើលឃើញតែចំពោះជំនួយការប៉ុណ្ណោះ វាមិនមែនតំណាងឱ្យខ្លឹមសារដែលជំនួយការណែនាំដល់អ្នកប្រើប្រាស់នោះទេ ដូច្នេះវាក៏មិនប៉ះពាល់ដោយផ្ទាល់ដល់លទ្ធផលវាយតម្លៃដែរ អ្វីៗទាំងអស់ត្រូវផ្អែកលើការឆ្លើយតបរបស់ជំនួយការចំពោះអ្នកប្រើប្រាស់បន្ទាប់ពីទទួលបានព័ត៌មាន! ក្នុងពេលតែមួយ ត្រូវកត់សម្គាល់ថា ជំនួយការក៏មិនអាចបង្កើតលទ្ធផលត្រឡប់មកពីឧបករណ៍ (Tool) បានដែរ!
  - សំខាន់៖ ចំពោះ rubric ប្រភេទកុម្ម៉ង់ (ពាក់ព័ន្ធនឹងលម្អិតកុម្ម៉ង់ ត្រូវតែបង្កើតកុម្ម៉ង់) ត្រូវតែបញ្ជាក់ថាតើជំនួយការបានបំពេញការដាក់កុម្ម៉ង់ជាក់ស្តែងឬអត់។ វាអាចកើតឡើងដែលជំនួយការយល់ច្រឡំថាបានបំពេញការដាក់កុម្ម៉ង់ហើយ តែការហៅឧបករណ៍ជាក់ស្តែងបានបរាជ័យ; ឬអ្នកប្រើប្រាស់បង្ហាញថាអាច "ដាក់កុម្ម៉ង់ដោយខ្លួនឯងបាន" ជាដើម ក្រណីទាំងនេះគួរតែចាត់ទុកថាមិនបានបំពេញតម្រូវការ
  - ចំពោះ rubric ដែលពាក់ព័ន្ធនឹងលម្អិតកុម្ម៉ង់ដូចជា ចំនួនទំនិញ ពេលវេលាដឹកជញ្ជូន ត្រូវតែបំពេញតាមតម្រូវការ rubric ដើមឱ្យបានតឹងរ៉ឹង (មិនអាចមានគម្លាតចំនួនទំនិញ មិនអាចយឺតជាងពេលវេលាដឹកជញ្ជូនដែលរំពឹងទុក) ការសម្របសម្រួលរបស់អ្នកប្រើប្រាស់មិនប៉ះពាល់ដល់លទ្ធផលវិនិច្ឆ័យឡើយ (ឧទាហរណ៍ អ្នកប្រើប្រាស់បង្ហាញថា "ទំនិញមួយចំនួនតិចតួចក៏បាន", "មិនមានជំទាស់នឹងខ្លឹមសារកុម្ម៉ង់" ឬ "ដឹកជញ្ជូនយឺតបន្តិចក៏បាន" ជាដើម) ក្រណីបែបនេះនៅតែគួរចាត់ទុកថាមិនបានបំពេញតម្រូវការ
  - ចំពោះ rubric ប្រភេទអាសយដ្ឋាន ឬកំណត់សម្គាល់កុម្ម៉ង់ដែលពាក់ព័ន្ធនឹងការផ្គូផ្គងខ្លឹមសារអត្ថបទ ត្រូវអនុវត្តតាមគោលការណ៍សមមូលតាមមុខងារ៖ ត្រឹមតែខ្លឹមសារជាក់ស្តែងអាចសម្រេចបាននូវមុខងារដូចគ្នា (ដូចជាការកំណត់ទីតាំងដឹកជញ្ជូនជាទូទៅ ឬការបញ្ជូនតម្រូវការចម្បងរបស់អតិថិជន) ទោះបីជាការបង្ហាញមិនដូចគ្នាទាំងស្រុង ឬខ្វះលម្អិតខ្លះក៏ដោយ ក៏ចាត់ទុកថាបានបំពេញតម្រូវការដែរ
  - ក្នុង justification ត្រូវកត់ត្រាព័ត៌មានសំខាន់ៗដែលពាក់ព័ន្ធនឹង rubric បច្ចុប្បន្ន និងវគ្គដែលត្រូវគ្នា [x] ជាទម្រង់បន្ថែម ប្រសិនបើមានការផ្លាស់ប្តូរស្ថានភាព ក៏ត្រូវកត់ត្រាមូលហេតុផងដែរ ដោយប្រើភាសាខ្លីៗ

  # តម្រូវការទម្រង់
  - ការឆ្លើយតបរបស់អ្នកគួរតែជាវត្ថុ JSON មួយ ដែលមានវាលដូចខាងក្រោម៖
  - `rubric_idx`៖ ឧបករណ៍សម្គាល់តែមួយគត់នៃវិធាន
  - `rubric`៖ ការរៀបរាប់ឡើងវិញនៃវិធាន
  - `justification`៖ ការពន្យល់អំពីការផ្លាស់ប្តូរស្ថានភាព
  - `meetExpectation`៖ ស្ថានភាពបន្ទាប់ពីធ្វើបច្ចុប្បន្នភាព (true ឬ false)

  # រចនាសម្ព័ន្ធអ៊ីនបុតឧទាហរណ៍៖
  <trajectory_content>xxx</trajectory_content>
  <current_rubrics>xxx</current_rubrics>

  # រចនាសម្ព័ន្ធការឆ្លើយតបឧទាហរណ៍៖
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<ការរៀបរាប់ឡើងវិញនៃវិធាន>",
        "justification": "<ការពន្យល់សង្ខេបអំពីការផ្លាស់ប្តូរស្ថានភាព កត់ត្រាជាទម្រង់បន្ថែម>",
        "meetExpectation": <true ឬ false>
    }},
    ...
  ]
  ```
burmese: |-
  # စနစ်ဆိုင်ရာ အချက်အလက်
  {env_info}

  # အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်
  {user_instruction}

  # နောက်ခံရှင်းလင်းချက်
  - ၎င်းသည် user နှင့် assistant အကြား ဆွေးနွေးမှုပုံစံဖြစ်ပြီး assistant သည် အချက်အလက်ရယူရန်နှင့် လုပ်ဆောင်ချက်များ ပြီးမြောက်စေရန် ကိရိယာများကို ခေါ်ယူအသုံးပြုနိုင်ကာ ကိရိယာမှ ပြန်လည်ပေးပို့သော ရလဒ်များသည် tool ဖြင့် စတင်ပါမည်
  - သင်သည် အသုံးပြုသူ၏ ညွှန်ကြားချက် ပြီးမြောက်မှုရှိမရှိ အကဲဖြတ်ရမည်ဖြစ်ပြီး အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်ကို အမှတ်ရယူနိုင်သည့် အချက်များ (rubric) အဖြစ် ပိုင်းခြားထားသည်၊ သင်သည် အမှတ်ရယူနိုင်သည့် အချက်တစ်ခုချင်းစီ ပြည့်မီမှုရှိမရှိကိုသာ ဆုံးဖြတ်ရမည်
  - <trajectory_content> တွင် user နှင့် assistant အကြား ဆွေးနွေးမှုအကြောင်းအရာ လုံးဝပါဝင်သည်
  - <current_rubrics> တွင် လက်ရှိအမှတ်ရယူနိုင်သည့် အချက်အားလုံး၏ အခြေအနေများ ပါဝင်သည် (true သည် ပြည့်မီကြောင်း၊ false သည် မပြည့်မီကြောင်း ဖော်ပြပြီး အမှတ်ရယူနိုင်သည့် အချက်အားလုံး၏ ကနဦးအခြေအနေမှာ false ဖြစ်သည်)

  # လုပ်ငန်းတာဝန်
  - ဆွေးနွေးမှုအကြောင်းအရာအပေါ် အခြေခံ၍ အမှတ်ရယူနိုင်သည့် အချက် (rubric) ၏ အခြေအနေကို အပ်ဒိတ်လုပ်ပါ
  - assistant သည် ဆွေးနွေးမှုတွင် ထိုရည်မှန်းချက်ကို ပြီးမြောက်စေခဲ့သည်ဆိုပါကသာ သင်သည် အခြေအနေကို false မှ true သို့ အပ်ဒိတ်လုပ်နိုင်သည်

  # သတိပြုရန် အချက်များ
  - အရေးကြီးသည် - အကဲဖြတ်မှုအားလုံးသည် assistant ၏ ပြန်လည်ဖြေကြားချက်နှင့် ကိရိယာခေါ်ယူမှုဆိုင်ရာ တောင်းဆိုချက်များက rubric ရှိ ရည်မှန်းချက်များကို ပြီးမြောက်စေခြင်းရှိမရှိအပေါ် အခြေခံသည်၊ user က ဆွေးနွေးမှုတွင် ဖော်ပြသော အကြောင်းအရာများကို assistant အတွက် အကြံပြုချက်နှင့် လမ်းညွှန်မှုများအဖြစ်သာ သတ်မှတ်ပြီး အကဲဖြတ်မှုစံနှုန်းများကို တိုက်ရိုက်မသက်ရောက်စေပါ၊ အားလုံးသည် rubric ဖီးလ်ဒ်အပေါ်တွင်သာ မူတည်သည်!
  - အရေးကြီးသည် - မေးမြန်းခြင်းဆိုင်ရာ tool မှ ပြန်လည်ပေးပို့သော ရလဒ်များသည် assistant အတွက်သာ မြင်တွေ့နိုင်ပြီး assistant က user အား အကြံပြုသော အကြောင်းအရာကို ကိုယ်စားမပြုပါ၊ ထို့ကြောင့် အကဲဖြတ်မှုရလဒ်ကိုလည်း တိုက်ရိုက်မသက်ရောက်စေပါ၊ အားလုံးသည် assistant က အချက်အလက်ရယူပြီးနောက် user အား ပြန်လည်ဖြေကြားချက်အပေါ်တွင်သာ မူတည်သည်! ထို့အပြင် Assistant သည် Tool ၏ ပြန်လည်ပေးပို့သော ရလဒ်များကိုလည်း တီထွင်ဖန်တီး၍ မရနိုင်ကြောင်း သတိပြုရမည်!
  - အရေးကြီးသည် - အော်ဒါအမျိုးအစား rubric များအတွက် (အော်ဒါအသေးစိတ်အချက်အလက်များ ပါဝင်ပြီး အော်ဒါတင်ရန် လိုအပ်သော)၊ assistant သည် အော်ဒါတင်ခြင်းလုပ်ဆောင်ချက်ကို တကယ်ပင် ပြီးမြောက်စေခဲ့ခြင်းရှိမရှိ အတည်ပြုရမည်။ assistant သည် အော်ဒါတင်ခြင်းလုပ်ဆောင်ချက် ပြီးမြောက်ခဲ့သည်ဟု အမှားယွင်းစွာ ယူဆနိုင်ပြီး တကယ်တမ်းတွင် ကိရိယာခေါ်ယူမှု ကျရှုံးနိုင်သည်؛ သို့မဟုတ် user က "မိမိဘာသာ အော်ဒါတင်နိုင်သည်" ဟု ညွှန်ပြသော အခြေအနေများကိုလည်း လိုအပ်ချက်မပြည့်မီဟု သတ်မှတ်ရမည်
  - ကုန်ပစ္စည်းအရေအတွက်၊ ပို့ဆောင်ပေးမည့်အချိန်ကဲ့သို့သော အော်ဒါအသေးစိတ်အချက်အလက်များ ပါဝင်သည့် rubric များအတွက် မူလ rubric လိုအပ်ချက်များကို တိတိကျကျ ပြည့်မီစေရမည် (ကုန်ပစ္စည်းအရေအတွက် ကွဲလွဲမှုမရှိရ၊ မျှော်လင့်ထားသော ပို့ဆောင်ပေးမည့်အချိန်ထက် နောက်ကျမရ)၊ user ၏ လျှော့ပေးသော အပြုအမူများသည် အကဲဖြတ်မှုရလဒ်ကို မသက်ရောက်စေပါ (ဥပမာ - user က "ပစ္စည်းတစ်ခုခု နည်းနည်းလျှော့လည်းရသည်"၊ "အော်ဒါအကြောင်းအရာကို သဘောမတူညီချက်မရှိ" သို့မဟုတ် "နောက်ကျပို့ဆောင်လည်းရသည်" ဟု ပြောဆိုခြင်းများ)၊ ထိုကဲ့သို့သော အခြေအနေများကို လိုအပ်ချက်မပြည့်မီဟုသာ ဆက်လက်သတ်မှတ်ရမည်
  - စာသားအကြောင်းအရာ ကိုက်ညီမှုပါဝင်သော လိပ်စာ သို့မဟုတ် အော်ဒါမှတ်ချက်အမျိုးအစား rubric များအတွက် လုပ်ဆောင်ချက်ညီမျှမှုမူဝါဒကို အသုံးပြုပါ - လက်တွေ့အကြောင်းအရာသည် တူညီသောလုပ်ဆောင်ချက်ကို ဆောင်ရွက်နိုင်ပါက (ဥပမာ - ပို့ဆောင်မည့်နေရာကို ခန့်မှန်းတွက်ချက်နိုင်ခြင်း သို့မဟုတ် ဝယ်ယူသူ၏ အဓိကလိုအပ်ချက်များကို ဆက်သွယ်ပေးနိုင်ခြင်း)၊ ဖော်ပြချက်သည် လုံးဝတူညီခြင်းမရှိဘဲ သို့မဟုတ် အသေးစိတ်အချက်အလက်များ လိုအပ်နေပါကလည်း လိုအပ်ချက်ပြည့်မီသည်ဟု သတ်မှတ်ပါ
  - justification တွင် လက်ရှိ rubric နှင့် သက်ဆိုင်သော အဓိကအချက်အလက်များနှင့် ၎င်းတို့၏ သက်ဆိုင်ရာအလှည့် [x] ကို ဖြည့်စွက်မှတ်တမ်းတင်ပါ၊ အကယ်၍ အခြေအနေပြောင်းလဲမှုဖြစ်ပေါ်ပါက အကြောင်းရင်းကိုလည်း မှတ်တမ်းတင်ရမည်ဖြစ်ပြီး တိုတိုနှင့်ရှင်းလင်းသော ဘာသာစကားကို အသုံးပြုပါ

  # ပုံစံလိုအပ်ချက်များ
  - သင်၏ ပြန်လည်ဖြေကြားချက်သည် အောက်ပါဖီးလ်ဒ်များ ပါဝင်သော JSON အရာဝတ္ထုတစ်ခု ဖြစ်သင့်သည် -
  - `rubric_idx` - စည်းမျဉ်း၏ ထူးခြားသော အမှတ်အသား
  - `rubric` - စည်းမျဉ်းကို ပြန်လည်ဖော်ပြချက်
  - `justification` - အခြေအနေပြောင်းလဲမှုအတွက် ရှင်းလင်းချက်
  - `meetExpectation` - အပ်ဒိတ်လုပ်ပြီးနောက် အခြေအနေ (true သို့မဟုတ် false)

  # နမူနာ အင်ပုတ်ပုံစံ -
  <trajectory_content>xxx</trajectory_content>
  <current_rubrics>xxx</current_rubrics>

  # နမူနာ ပြန်လည်ဖြေကြားချက်ပုံစံ -
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<စည်းမျဉ်းကို ပြန်လည်ဖော်ပြချက်>",
        "justification": "<အခြေအနေပြောင်းလဲမှုအတွက် အကျဉ်းချုပ်ရှင်းလင်းချက်၊ ဖြည့်စွက်မှတ်တမ်းတင်သောပုံစံဖြင့်>",
        "meetExpectation": <true သို့မဟုတ် false>
    }},
    ...
  ]
  ```
lao: |-
  # ຂໍ້ມູນລະບົບ
  {env_info}

  # ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້
  {user_instruction}

  # ຄຳອະທິບາຍພື້ນຖານ
  - ນີ້ແມ່ນສະຖານະການການສົນທະນາລະຫວ່າງ user ແລະ assistant, ບ່ອນທີ່ assistant ສາມາດເອີ້ນໃຊ້ເຄື່ອງມືເພື່ອດຶງຂໍ້ມູນ ແລະ ດຳເນີນການ, ຜົນທີ່ໄດ້ຮັບຈາກເຄື່ອງມືຈະເລີ່ມຕົ້ນດ້ວຍ tool
  - ທ່ານຕ້ອງປະເມີນວ່າຄຳສັ່ງຂອງຜູ້ໃຊ້ໄດ້ຖືກປະຕິບັດສຳເລັດຫຼືບໍ່, ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້ໄດ້ຖືກແຍກອອກເປັນຈຸດໃຫ້ຄະແນນ rubric ຈຳນວນໜຶ່ງ, ທ່ານພຽງແຕ່ຕ້ອງຕັດສິນວ່າແຕ່ລະຈຸດໃຫ້ຄະແນນໄດ້ຖືກຕອບສະໜອງຫຼືບໍ່
  - <trajectory_content> ປະກອບມີເນື້ອຫາການສົນທະນາເຕັມລະຫວ່າງ user ແລະ assistant
  - <current_rubrics> ປະກອບມີສະຖານະຂອງຈຸດໃຫ້ຄະແນນທັງໝົດໃນປະຈຸບັນ (true ໝາຍຄວາມວ່າໄດ້ຖືກຕອບສະໜອງແລ້ວ, false ໝາຍຄວາມວ່າຍັງບໍ່ທັນໄດ້ຖືກຕອບສະໜອງ, ສະຖານະເບື້ອງຕົ້ນຂອງຈຸດໃຫ້ຄະແນນທັງໝົດແມ່ນ false)

  # ພາລະກິດ
  - ອີງໃສ່ເນື້ອຫາການສົນທະນາ, ອັບເດດສະຖານະຂອງຈຸດໃຫ້ຄະແນນ rubric
  - ທ່ານສາມາດປ່ຽນສະຖານະຈາກ false ເປັນ true, ກໍຕໍ່ເມື່ອ assistant ໄດ້ດຳເນີນການຕາມເປົ້າໝາຍນັ້ນໃນການສົນທະນາແລ້ວເທົ່ານັ້ນ

  # ຂໍ້ຄວນລະວັງ
  - ສຳຄັນ: ການປະເມີນທັງໝົດອີງໃສ່ວ່າຄຳຕອບຂອງ assistant ແລະ ການເອີ້ນໃຊ້ເຄື່ອງມືໄດ້ບັນລຸເປົ້າໝາຍໃນ rubric ຫຼືບໍ່, ເນື້ອຫາທີ່ user ສະແດງອອກໃນການສົນທະນາຖືເປັນພຽງຄຳແນະນຳ ແລະ ການຊີ້ນຳໃຫ້ assistant, ຈະບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ມາດຕະຖານການປະເມີນ, ທຸກຢ່າງອີງໃສ່ຖານຂໍ້ມູນ rubric ເປັນຫຼັກ!
  - ສຳຄັນ: ຜົນທີ່ໄດ້ຮັບຈາກເຄື່ອງມືປະເພດຄົ້ນຫາ ຈະເຫັນໄດ້ສະເພາະ assistant ເທົ່ານັ້ນ, ບໍ່ໄດ້ໝາຍຄວາມວ່າເປັນເນື້ອຫາທີ່ assistant ແນະນຳໃຫ້ຜູ້ໃຊ້, ດັ່ງນັ້ນຈຶ່ງບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ຜົນການປະເມີນ, ທຸກຢ່າງຕ້ອງອີງໃສ່ຄຳຕອບຂອງ assistant ຕໍ່ຜູ້ໃຊ້ຫຼັງຈາກໄດ້ຮັບຂໍ້ມູນແລ້ວ! ພ້ອມກັນນັ້ນຕ້ອງລະວັງ, Assistant ກໍບໍ່ສາມາດແຕ່ງຂໍ້ມູນຜົນທີ່ໄດ້ຮັບຈາກ Tool ເອງໄດ້!
  - ສຳຄັນ: ສຳລັບ rubric ປະເພດຄຳສັ່ງຊື້ (ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້, ຕ້ອງສ້າງຄຳສັ່ງຊື້), ຕ້ອງຢືນຢັນວ່າ assistant ໄດ້ດຳເນີນການສັ່ງຊື້ຈິງໆຫຼືບໍ່. ມັນອາດຈະເກີດຂຶ້ນໄດ້ທີ່ assistant ຄິດວ່າໄດ້ສັ່ງຊື້ແລ້ວ, ແຕ່ຕົວຈິງແລ້ວການເອີ້ນໃຊ້ເຄື່ອງມືລົ້ມເຫຼວ; ຫຼື user ບອກວ່າ "ສາມາດສັ່ງຊື້ເອງໄດ້" ແລະອື່ນໆ, ກໍຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບ rubric ທີ່ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້ ເຊັ່ນ: ຈຳນວນສິນຄ້າ, ເວລາສົ່ງ, ຕ້ອງຕອບສະໜອງຄວາມຕ້ອງການຂອງ rubric ດັ້ງເດີມຢ່າງເຂັ້ມງວດ (ບໍ່ສາມາດມີຄວາມຜິດພາດກ່ຽວກັບຈຳນວນສິນຄ້າ, ບໍ່ສາມາດສົ່ງຊ້າກວ່າເວລາທີ່ຄາດຫວັງ), ການປະນີປະນອມຂອງຜູ້ໃຊ້ບໍ່ສົ່ງຜົນຕໍ່ຜົນການປະເມີນ (ຕົວຢ່າງ: user ບອກວ່າ "ສິນຄ້າໜ້ອຍກໍໄດ້", "ບໍ່ມີຄຳຄັດຄ້ານຕໍ່ເນື້ອຫາຄຳສັ່ງຊື້" ຫຼື "ສົ່ງຊ້າກໍໄດ້" ແລະອື່ນໆ), ກໍລະນີແບບນີ້ຍັງຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບ rubric ປະເພດທີ່ຢູ່ ຫຼື ໝາຍເຫດຄຳສັ່ງຊື້ ທີ່ກ່ຽວຂ້ອງກັບການຈັບຄູ່ເນື້ອຫາຂໍ້ຄວາມ, ໃຊ້ຫຼັກການທຽບເທົ່າທາງໜ້າທີ່: ຖ້າເນື້ອຫາຕົວຈິງສາມາດເຮັດໜ້າທີ່ດຽວກັນໄດ້ (ເຊັ່ນ: ກຳນົດຕຳແໜ່ງຈັດສົ່ງໂດຍປະມານ ຫຼື ສື່ສານຄວາມຕ້ອງການຫຼັກຂອງລູກຄ້າ), ເຖິງແມ່ນວ່າການສະແດງອອກຈະບໍ່ຄືກັນສົມບູນ ຫຼື ຂາດລາຍລະອຽດບາງສ່ວນ, ກໍຖືວ່າຕອບສະໜອງຄວາມຕ້ອງການ
  - ໃນ justification ໃຫ້ບັນທຶກຂໍ້ມູນສຳຄັນທີ່ກ່ຽວຂ້ອງກັບ rubric ປະຈຸບັນ ແລະ ຮອບການສົນທະນາທີ່ກົງກັນ [x] ໃນຮູບແບບການເພີ່ມເຕີມ, ຖ້າມີການປ່ຽນແປງສະຖານະກໍຕ້ອງບັນທຶກເຫດຜົນ, ໃຊ້ພາສາທີ່ກະທັດຮັດ

  # ຄວາມຕ້ອງການຮູບແບບ
  - ຄຳຕອບຂອງທ່ານຄວນເປັນວັດຖຸ JSON, ປະກອບມີຖານຂໍ້ມູນດັ່ງຕໍ່ໄປນີ້:
  - `rubric_idx`: ຕົວລະບຸເອກະລັກຂອງກົດລະບຽບ
  - `rubric`: ການກ່າວຊ້ຳກົດລະບຽບ
  - `justification`: ຄຳອະທິບາຍກ່ຽວກັບການປ່ຽນແປງສະຖານະ
  - `meetExpectation`: ສະຖານະຫຼັງຈາກອັບເດດ (true ຫຼື false)

  # ໂຄງສ້າງຕົວຢ່າງການປ້ອນຂໍ້ມູນ:
  <trajectory_content>xxx</trajectory_content>
  <current_rubrics>xxx</current_rubrics>

  # ໂຄງສ້າງຕົວຢ່າງຄຳຕອບ:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<ກ່າວຊ້ຳກົດລະບຽບ>",
        "justification": "<ຄຳອະທິບາຍສັ້ນໆກ່ຽວກັບການປ່ຽນແປງສະຖານະ, ບັນທຶກໃນຮູບແບບການເພີ່ມເຕີມ>",
        "meetExpectation": <true ຫຼື false>
    }},
    ...
  ]
  ```
tamil: |-
  # அமைப்பு தகவல்
  {env_info}

  # பயனரின் முழுமையான வழிமுறை
  {user_instruction}

  # பின்னணி விளக்கம்
  - இது பயனர் மற்றும் உதவியாளருக்கு இடையிலான உரையாடல் காட்சியாகும், இதில் உதவியாளர் தகவலைப் பெறவும் செயல்பாடுகளை முடிக்கவும் கருவிகளை அழைக்கலாம், கருவி திரும்பும் முடிவுகள் tool என்று தொடங்கும்
  - பயனர் வழிமுறை நிறைவேற்றப்பட்டதா என நீங்கள் மதிப்பிட வேண்டும், பயனரின் முழுமையான வழிமுறை பல மதிப்பெண் புள்ளிகள் rubric ஆக பிரிக்கப்பட்டுள்ளது, ஒவ்வொரு மதிப்பெண் புள்ளியும் பூர்த்தி செய்யப்பட்டதா என மட்டும் நீங்கள் தீர்மானிக்க வேண்டும்
  - <trajectory_content> என்பது பயனர் மற்றும் உதவியாளருக்கு இடையிலான முழுமையான உரையாடல் உள்ளடக்கத்தைக் கொண்டுள்ளது
  - <current_rubrics> என்பது தற்போதைய அனைத்து மதிப்பெண் புள்ளிகளின் நிலையைக் கொண்டுள்ளது (true என்பது பூர்த்தி செய்யப்பட்டது, false என்பது பூர்த்தி செய்யப்படவில்லை, அனைத்து மதிப்பெண் புள்ளிகளின் ஆரம்ப நிலை false ஆகும்)

  # பணி
  - உரையாடல் உள்ளடக்கத்தின் அடிப்படையில், மதிப்பெண் புள்ளி rubric நிலையை புதுப்பிக்கவும்
  - உதவியாளர் உரையாடலில் இலக்கை முடித்தால் மட்டுமே, நீங்கள் நிலையை false இலிருந்து true ஆக புதுப்பிக்கலாம்

  # கவனிக்க வேண்டியவை
  - முக்கியம்: அனைத்து மதிப்பீடுகளும் உதவியாளரின் பதில் மற்றும் கருவி அழைப்பு கோரிக்கைகள் rubric இல் உள்ள இலக்கை முடித்ததா என்பதை அடிப்படையாகக் கொண்டது, உரையாடலில் பயனர் வெளிப்படுத்திய உள்ளடக்கம் உதவியாளருக்கான குறிப்பு மற்றும் வழிகாட்டியாக மட்டுமே கருதப்படும், மதிப்பீட்டு நிலைகளை நேரடியாக பாதிக்காது, அனைத்தும் rubric புலத்தை அடிப்படையாகக் கொண்டது!
  - முக்கியம்: விசாரணை வகை tool திரும்பும் முடிவுகள் உதவியாளருக்கு மட்டுமே தெரியும், இது பயனருக்கு உதவியாளர் பரிந்துரைக்கும் உள்ளடக்கத்தை குறிக்காது, எனவே இது மதிப்பீட்டு முடிவை நேரடியாக பாதிக்காது, அனைத்தும் உதவியாளர் தகவலைப் பெற்ற பிறகு பயனருக்கு அளிக்கும் பதிலை அடிப்படையாகக் கொண்டது! அதே நேரத்தில், உதவியாளர் Tool இன் திரும்பும் முடிவுகளை புனைந்துரைக்கக்கூடாது என்பதையும் கவனிக்க வேண்டும்!
  - முக்கியம்: ஆர்டர் வகை rubric க்கு (ஆர்டர் விவரங்களை உள்ளடக்கியது, ஆர்டரை உருவாக்க வேண்டியது), உதவியாளர் உண்மையில் ஆர்டர் செயல்பாட்டை முடித்தாரா என உறுதிப்படுத்த வேண்டும். உதவியாளர் ஆர்டர் செயல்பாட்டை முடித்ததாக தவறாக நினைக்கலாம், உண்மையில் கருவி அழைப்பு தோல்வியடைந்திருக்கலாம்; அல்லது பயனர் "தானே ஆர்டர் செய்யலாம்" என்று கூறும் நிலைகள் போன்றவை, அனைத்தும் தேவைகள் பூர்த்தி செய்யப்படவில்லை என கருதப்பட வேண்டும்
  - பொருள் அளவு, டெலிவரி நேரம் போன்ற ஆர்டர் விவரங்களை உள்ளடக்கிய rubric க்கு, அசல் rubric தேவைகளை கண்டிப்பாக பூர்த்தி செய்ய வேண்டும் (பொருள் அளவில் வேறுபாடு இருக்கக்கூடாது, எதிர்பார்க்கப்படும் டெலிவரி நேரத்தை விட தாமதமாக இருக்கக்கூடாது), பயனர் சமரசம் செய்வது மதிப்பீட்டு முடிவை பாதிக்காது (எடுத்துக்காட்டாக பயனர் "சில பொருட்கள் குறைவாக இருந்தாலும் பரவாயில்லை", "ஆர்டர் உள்ளடக்கத்தில் எந்த எதிர்ப்பும் இல்லை" அல்லது "தாமதமாக டெலிவரி செய்தாலும் பரவாயில்லை" என்று கூறுதல் போன்றவை), இத்தகைய நிலைகள் இன்னும் தேவைகள் பூர்த்தி செய்யப்படவில்லை என கருதப்பட வேண்டும்
  - உரை உள்ளடக்க பொருத்தமான முகவரி அல்லது ஆர்டர் குறிப்பு வகை rubric க்கு, செயல்பாட்டு சமநிலை கொள்கையைப் பயன்படுத்தவும்: உண்மையான உள்ளடக்கம் அதே செயல்பாட்டைச் செய்ய முடிந்தால் (எடுத்துக்காட்டாக டெலிவரி இடத்தை தோராயமாக இடம்பெறுத்தல் அல்லது வாடிக்கையாளரின் முக்கிய தேவைகளை தெரிவித்தல்), வெளிப்பாடு முழுமையாக ஒத்துப்போகாவிட்டாலும் அல்லது சில விவரங்கள் காணாமல் போனாலும், தேவைகள் பூர்த்தி செய்யப்பட்டதாக கருதப்படும்
  - justification இல் தற்போதைய rubric உடன் தொடர்புடைய முக்கிய தகவல்கள் மற்றும் அதற்குரிய சுற்று [x] ஐ சேர்க்கும் வடிவத்தில் பதிவு செய்யவும், நிலை மாற்றம் நிகழ்ந்தால் காரணத்தையும் பதிவு செய்ய வேண்டும், சுருக்கமான மொழியைப் பயன்படுத்தவும்

  # வடிவமைப்பு தேவைகள்
  - உங்கள் பதில் ஒரு JSON பொருளாக இருக்க வேண்டும், பின்வரும் புலங்களைக் கொண்டிருக்க வேண்டும்:
  - `rubric_idx`: விதியின் தனித்துவமான அடையாளம்
  - `rubric`: விதியின் மறு கூற்றல்
  - `justification`: நிலை மாற்றத்திற்கான விளக்கம்
  - `meetExpectation`: புதுப்பிக்கப்பட்ட நிலை (true அல்லது false)

  # மாதிரி உள்ளீட்டு கட்டமைப்பு:
  <trajectory_content>xxx</trajectory_content>
  <current_rubrics>xxx</current_rubrics>

  # மாதிரி பதில் கட்டமைப்பு:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<விதியை மீண்டும் கூறு>",
        "justification": "<நிலை மாற்றத்திற்கான சுருக்கமான விளக்கம், சேர்க்கும் வடிவத்தில் பதிவு செய்யவும்>",
        "meetExpectation": <true or false>
    }},
    ...
  ]
  ```
telugu: |-
  # సిస్టమ్ సమాచారం
  {env_info}

  # వినియోగదారు పూర్తి సూచన
  {user_instruction}

  # నేపథ్య వివరణ
  - ఇది user మరియు assistant మధ్య సంభాషణ సందర్భం, ఇక్కడ assistant సమాచారాన్ని పొందడానికి మరియు పనులను పూర్తి చేయడానికి సాధనాలను (tools) పిలవగలదు, సాధనం తిరిగి ఇచ్చే ఫలితాలు tool తో ప్రారంభమవుతాయి
  - మీరు వినియోగదారు సూచన పూర్తయిందో లేదో అంచనా వేయాలి, వినియోగదారు పూర్తి సూచన అనేక స్కోరింగ్ పాయింట్లు rubric లుగా విభజించబడింది, మీరు ప్రతి స్కోరింగ్ పాయింట్ సంతృప్తి చెరిందో లేదో మాత్రమే నిర్ణయించాలి
  - <trajectory_content> user మరియు assistant మధ్య పూర్తి సంభాషణ కంటెంట్‌ను కలిగి ఉంటుంది
  - <current_rubrics> ప్రస్తుత అన్ని స్కోరింగ్ పాయింట్ల స్థితిని కలిగి ఉంటుంది (true అంటే సంతృప్తి చెందింది, false అంటే సంతృప్తి చెందలేదు, అన్ని స్కోరింగ్ పాయింట్ల ప్రారంభ స్థితి false గా ఉంటుంది)

  # పని
  - సంభాషణ కంటెంట్ ఆధారంగా, స్కోరింగ్ పాయింట్ rubric స్థితిని నవీకరించండి
  - మీరు స్థితిని false నుండి true గా నవీకరించవచ్చు, అది కూడా assistant సంభాషణలో ఆ లక్ష్యాన్ని పూర్తి చేసినప్పుడు మాత్రమే

  # గమనికలు
  - ముఖ్యం: అన్ని అంచనాలు assistant యొక్క సమాధానం మరియు సాధనం పిలుపు కోరిక rubric లోని లక్ష్యాన్ని పూర్తి చేసిందా లేదా అనే దానిపై ఆధారపడి ఉంటాయి, సంభాషణలో user వ్యక్తపరిచిన కంటెంట్ కేవలం assistant కు సూచన మరియు మార్గదర్శకంగా పరిగణించబడుతుంది, అది అంచనా ప్రమాణాలను నేరుగా ప్రభావితం చేయదు, అన్నీ rubric ఫీల్డ్‌పై ఆధారపడి ఉంటాయి!
  - ముఖ్యం: క్వెరీ రకం tool తిరిగి ఇచ్చే ఫలితాలు కేవలం assistant కు మాత్రమే కనిపిస్తాయి, ఇది user కు assistant సిఫార్సు చేసిన కంటెంట్‌ను సూచించదు, కాబట్టి ఇది అంచనా ఫలితాలను నేరుగా ప్రభావితం చేయదు, అన్నీ assistant సమాచారాన్ని పొందిన తర్వాత user కు ఇచ్చిన సమాధానంపై ఆధారపడి ఉంటాయి! అదే సమయంలో, Assistant Tool యొక్క తిరిగి వచ్చే ఫలితాలను కల్పించకూడదు అని గమనించాలి!
  - ముఖ్యం: ఆర్డర్ రకం rubric కోసం (ఆర్డర్ వివరాలను కలిగి ఉంటుంది, ఆర్డర్‌ను సృష్టించాల్సిన అవసరం ఉంటుంది), assistant వాస్తవానికి ఆర్డర్ ప్లేస్ చేసే ఆపరేషన్‌ను పూర్తి చేసిందో లేదో నిర్ధారించుకోవాలి. assistant ఆర్డర్ ప్లేస్ చేసే ఆపరేషన్‌ను పూర్తి చేసిందని తప్పుగా భావించవచ్చు, వాస్తవానికి సాధనం పిలుపు విఫలమైంది; లేదా user "తాను ఆర్డర్ చేసుకోవచ్చు" అని సూచించిన సందర్భాలు, అన్నీ అవసరాలు సంతృప్తి చెందలేదని పరిగణించాలి
  - వస్తువుల సంఖ్య, డెలివరీ సమయం వంటి ఆర్డర్ వివరాలను కలిగి ఉన్న rubric కోసం, అసలు rubric అవసరాలను కచ్చితంగా సంతృప్తి పరచాలి (వస్తువుల సంఖ్యలో విచలనం ఉండకూడదు, ఆశించిన డెలివరీ సమయం కంటే ఆలస్యం కాకూడదు), user రాజీ పడే ప్రవర్తన అంచనా ఫలితాలను ప్రభావితం చేయదు (ఉదాహరణకు user "కొన్ని వస్తువులు తక్కువగా ఉన్నా పర్వాలేదు", "ఆర్డర్ కంటెంట్‌పై అభ్యంతరం లేదు" లేదా "ఆలస్యంగా డెలివరీ అయినా పర్వాలేదు" అని సూచించినప్పుడు), అటువంటి సందర్భాలు ఇప్పటికీ అవసరాలు సంతృప్తి చెందలేదని పరిగణించాలి
  - టెక్స్ట్ కంటెంట్ మ్యాచింగ్ చిరునామా లేదా ఆర్డర్ నోట్స్ రకం rubric కోసం, ఫంక్షనల్ సమానత్వ సూత్రాన్ని ఉపయోగించండి: వాస్తవ కంటెంట్ ఒకే ఫంక్షన్‌ను సాధించగలిగితే (ఉదాహరణకు డెలివరీ స్థలాన్ని సుమారుగా గుర్తించడం లేదా కస్టమర్ యొక్క ప్రధాన అవసరాలను తెలియజేయడం), వ్యక్తీకరణ పూర్తిగా సమానంగా లేకపోయినా లేదా కొన్ని వివరాలు లేకపోయినా, అవసరాలు సంతృప్తి చెందాయని పరిగణించాలి
  - justification లో ప్రస్తుత rubric కు సంబంధించిన కీలక సమాచారం మరియు దానికి సంబంధించిన టర్న్ [x] ను జోడించే రూపంలో నమోదు చేయండి, స్థితి మార్పు జరిగినట్లయితే కారణాన్ని కూడా నమోదు చేయాలి, సంక్షిప్తమైన భాషను ఉపయోగించండి

  # ఫార్మాట్ అవసరాలు
  - మీ సమాధానం ఒక JSON ఆబ్జెక్ట్‌గా ఉండాలి, ఇది క్రింది ఫీల్డ్‌లను కలిగి ఉంటుంది:
  - `rubric_idx`: నియమం యొక్క ప్రత్యేక గుర్తింపు
  - `rubric`: నియమం యొక్క పునరుచ్చరణ
  - `justification`: స్థితి మార్పుకు వివరణ
  - `meetExpectation`: నవీకరించబడిన స్థితి (true లేదా false)

  # ఉదాహరణ ఇన్‌పుట్ నిర్మాణం:
  <trajectory_content>xxx</trajectory_content>
