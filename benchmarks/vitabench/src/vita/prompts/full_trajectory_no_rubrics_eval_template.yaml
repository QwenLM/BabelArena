  # ຂໍ້ຄວນລະວັງ
  - ສຳຄັນ: ການປະເມີນທັງໝົດອີງໃສ່ວ່າການຕອບກັບຂອງ assistant ແລະ ຄຳຮ້ອງເອີ້ນໃຊ້ເຄື່ອງມືໄດ້ປະຕິບັດຄຳສັ່ງຂອງຜູ້ໃຊ້ຫຼືບໍ່, ເນື້ອຫາທີ່ user ສະແດງອອກໃນການສົນທະນາຖືວ່າເປັນແຄ່ຄຳແນະນຳ ແລະ ການຊີ້ນຳໃຫ້ assistant, ຈະບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ມາດຕະຖານການປະເມີນ, ທຸກຢ່າງອີງໃສ່ຄຳສັ່ງຂອງຜູ້ໃຊ້ເປັນຫຼັກ!
  - ສຳຄັນ: ຜົນການຕອບກັບຂອງເຄື່ອງມືປະເພດສອບຖາມຈະເຫັນໄດ້ສະເພາະ assistant ເທົ່ານັ້ນ, ບໍ່ໄດ້ໝາຍຄວາມວ່າເປັນເນື້ອຫາທີ່ assistant ແນະນຳໃຫ້ຜູ້ໃຊ້, ດັ່ງນັ້ນຈຶ່ງບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ຜົນການປະເມີນ, ທຸກຢ່າງຕ້ອງອີງໃສ່ການຕອບກັບຂອງ assistant ຫຼັງຈາກໄດ້ຮັບຂໍ້ມູນແລ້ວຕໍ່ຜູ້ໃຊ້ເປັນຫຼັກ! ພ້ອມກັນນັ້ນຕ້ອງລະວັງ, Assistant ກໍບໍ່ສາມາດແຕ່ງຂໍ້ມູນຜົນການຕອບກັບຂອງ Tool ເອງໄດ້!
  - ສຳຄັນ: ສຳລັບຄຳສັ່ງປະເພດຊື້ຂອງ (ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້, ຕ້ອງສ້າງຄຳສັ່ງຊື້), ຕ້ອງຢືນຢັນວ່າ assistant ໄດ້ດຳເນີນການສັ່ງຊື້ສຳເລັດແທ້ຫຼືບໍ່. ມັນເປັນໄປໄດ້ທີ່ assistant ຄິດຜິດວ່າໄດ້ດຳເນີນການສັ່ງຊື້ແລ້ວ, ແຕ່ຕົວຈິງແລ້ວການເອີ້ນໃຊ້ເຄື່ອງມືລົ້ມເຫຼວ; ຫຼື user ສະແດງວ່າສາມາດ "ສັ່ງຊື້ເອງໄດ້" ແລະ ອື່ນໆ, ກໍຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບຄຳສັ່ງຂອງຜູ້ໃຊ້ທີ່ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້ເຊັ່ນ: ຈຳນວນສິນຄ້າ, ເວລາສົ່ງ, ຕ້ອງຕອບສະໜອງຄວາມຕ້ອງງານຂອງຄຳສັ່ງຜູ້ໃຊ້ເດີມຢ່າງເຂັ້ມງວດ (ບໍ່ສາມາດມີຄວາມຜິດພາດກ່ຽວກັບຈຳນວນສິນຄ້າ, ບໍ່ສາມາດຊ້າກວ່າເວລາສົ່ງທີ່ຄາດຫວັງ), ການປະນີປະນອມຂອງຜູ້ໃຊ້ບໍ່ສົ່ງຜົນຕໍ່ຜົນການປະເມີນ (ຕົວຢ່າງ user ສະແດງວ່າ "ສິນຄ້າໃດໜຶ່ງໜ້ອຍກໍໄດ້", "ບໍ່ມີຄຳຄັດຄ້ານຕໍ່ເນື້ອຫາຄຳສັ່ງຊື້" ຫຼື "ສົ່ງຊ້າກໍໄດ້" ແລະ ອື່ນໆ), ສະຖານະການແບບນີ້ຍັງຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບຄຳສັ່ງຂອງຜູ້ໃຊ້ປະເພດທີ່ຢູ່ ຫຼື ໝາຍເຫດຄຳສັ່ງຊື້ທີ່ກ່ຽວຂ້ອງກັບການຈັບຄູ່ເນື້ອຫາຂໍ້ຄວາມ, ໃຊ້ຫຼັກການທຽບເທົ່າທາງໜ້າທີ່: ຖ້າເນື້ອຫາຕົວຈິງສາມາດບັນລຸໜ້າທີ່ດຽວກັນໄດ້ (ເຊັ່ນ: ກຳນົດຕຳແໜ່ງຈັດສົ່ງໂດຍປະມານ ຫຼື ຖ່າຍທອດຄວາມຕ້ອງການຫຼັກຂອງລູກຄ້າ), ເຖິງແມ່ນວ່າການສະແດງອອກຈະບໍ່ຄືກັນສົມບູນ ຫຼື ຂາດລາຍລະອຽດບາງສ່ວນ, ກໍຖືວ່າຕອບສະໜອງຄວາມຕ້ອງການ
