  - ఇది వినియోగదారు మరియు అసిస్టెంట్ మధ్య సంభాషణ దృశ్యం, ఇక్కడ అసిస్టెంట్ సమాచారాన్ని పొందడానికి మరియు పనులను పూర్తి చేయడానికి సాధనాలను ఉపయోగించగలదు, సాధనం తిరిగి ఇచ్చే ఫలితాలు tool తో ప్రారంభమవుతాయి
  - వినియోగదారు సూచన పూర్తయిందో లేదో మీరు అంచనా వేయాలి
  - <trajectory_content> వినియోగదారు మరియు అసిస్టెంట్ మధ్య పూర్తి సంభాషణ కంటెంట్‌ను కలిగి ఉంటుంది

  # పని
  - సంభాషణ కంటెంట్ ఆధారంగా, వినియోగదారు పూర్తి సూచనలోని అన్ని ఉప అవసరాలు పూర్తయ్యాయో లేదో నిర్ణయించండి

  # గమనికలు
  - ముఖ్యం: అన్ని అంచనాలు అసిస్టెంట్ స్పందన మరియు సాధనం పిలుపు వినియోగదారు సూచనను పూర్తి చేసిందా లేదా అనే దానిపై ఆధారపడి ఉంటాయి, సంభాషణలో వినియోగదారు వ్యక్తపరిచిన కంటెంట్ కేవలం అసిస్టెంట్‌కు సూచన మరియు మార్గదర్శకంగా పరిగణించబడుతుంది, ఇది అంచనా ప్రమాణాలను నేరుగా ప్రభావితం చేయదు, అన్నీ వినియోగదారు సూచన ప్రకారం ఉండాలి!
  - ముఖ్యం: క్వెరీ రకం tool తిరిగి ఇచ్చే ఫలితాలు కేవలం అసిస్టెంట్‌కు మాత్రమే కనిపిస్తాయి, ఇవి వినియోగదారుకు అసిస్టెంట్ సిఫార్సు చేసిన కంటెంట్‌ను సూచించవు, కాబట్టి ఇవి అంచనా ఫలితాలను నేరుగా ప్రభావితం చేయవు, అన్నీ అసిస్టెంట్ సమాచారాన్ని పొందిన తర్వాత వినియోగదారుకు ఇచ్చిన స్పందన ప్రకారం ఉండాలి! అదే సమయంలో, అసిస్టెంట్ సాధనం యొక్క తిరిగి వచ్చే ఫలితాలను కల్పించకూడదు అని గమనించాలి!
  - ముఖ్యం: కొనుగోలు రకం సూచనల కోసం (ఆర్డర్ వివరాలను కలిగి ఉంటుంది, ఆర్డర్‌ను సృష్టించాల్సిన అవసరం ఉంటుంది), అసిస్టెంట్ వాస్తవానికి ఆర్డర్ చేసే పనిని పూర్తి చేసిందో లేదో నిర్ధారించుకోవాలి. అసిస్టెంట్ ఆర్డర్ చేసే పని పూర్తయిందని తప్పుగా భావించవచ్చు, వాస్తవానికి సాధనం పిలుపు విఫలమైంది; లేదా వినియోగదారు "తాను ఆర్డర్ చేసుకోవచ్చు" అని సూచించిన సందర్భాలు, అన్నీ అవసరాలు నెరవేరలేదని పరిగణించబడాలి
  - వస్తువుల సంఖ్య, డెలివరీ సమయం వంటి ఆర్డర్ వివరాలను కలిగి ఉన్న వినియోగదారు సూచనల కోసం, అసలు వినియోగదారు సూచన అవసరాలను కచ్చితంగా పాటించాలి (వస్తువుల సంఖ్యలో వ్యత్యాసం ఉండకూడదు, అనుకున్న డెలివరీ సమయం కంటే ఆలస్యం కాకూడదు), వినియోగదారు రాజీ పడటం అంచనా ఫలితాన్ని ప్రభావితం చేయదు (ఉదాహరణకు వినియోగదారు "కొన్ని వస్తువులు తక్కువగా ఉన్నా పర్వాలేదు", "ఆర్డర్ కంటెంట్‌పై అభ్యంతరం లేదు" లేదా "కొంచెం ఆలస్యంగా వచ్చినా పర్వాలేదు" అని సూచించినప్పుడు), అటువంటి సందర్భాలు ఇప్పటికీ అవసరాలు నెరవేరలేదని పరిగణించబడాలి
  - టెక్స్ట్ కంటెంట్ మ్యాచింగ్‌కు సంబంధించిన చిరునామా లేదా ఆర్డర్ నోట్స్ రకం వినియోగదారు సూచనల కోసం, ఫంక్షనల్ సమానత్వ సూత్రాన్ని అనుసరించండి: వాస్తవ కంటెంట్ ఒకే ఫంక్షన్‌ను సాధించగలిగితే (ఉదాహరణకు డెలివరీ స్థలాన్ని సుమారుగా గుర్తించడం లేదా కస్టమర్ యొక్క ప్రధాన అవసరాలను తెలియజేయడం), వ్యక్తీకరణ పూర్తిగా సమానంగా లేకపోయినా లేదా కొన్ని వివరాలు లేకపోయినా, అవసరాలు నెరవేరినట్లు పరిగణించబడుతుంది
  - justification లో వినియోగదారు సూచనకు సంబంధించిన కీలక సమాచారం, పూర్తయిందో లేదో నిర్ణయించడానికి ఆధారం మరియు దానికి సంబంధించిన రౌండ్ [x] ను నమోదు చేయండి

