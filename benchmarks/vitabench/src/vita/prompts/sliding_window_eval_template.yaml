  # அமைப்பு தகவல்
  {env_info}

  # பயனரின் முழுமையான வழிமுறை
  {user_instruction}

  # பின்னணி விளக்கம்
  - இது பயனர் மற்றும் உதவியாளருக்கு இடையேயான உரையாடல் காட்சியாகும், இதில் உதவியாளர் தகவலைப் பெறவும் செயல்பாடுகளை முடிக்கவும் கருவிகளை அழைக்கலாம், கருவி திரும்பும் முடிவுகள் tool என்று தொடங்கும்
  - பயனர் வழிமுறை முடிக்கப்பட்டதா என நீங்கள் மதிப்பிட வேண்டும், பயனரின் முழுமையான வழிமுறை பல மதிப்பெண் புள்ளிகள் rubric ஆக பிரிக்கப்பட்டுள்ளது, ஒவ்வொரு மதிப்பெண் புள்ளியும் பூர்த்தி செய்யப்பட்டதா என மட்டும் நீங்கள் தீர்மானிக்க வேண்டும்
  - உரையாடல் சுற்றுகள் அதிகமாக இருப்பதால், நாங்கள் நகரும் சாளர மதிப்பீட்டு முறையைப் பயன்படுத்துகிறோம், அதாவது ஒவ்வொரு முறையும் 10 உரையாடல் சுற்றுகள் தெரியும், ஒவ்வொரு சாளரத்திற்கும் இடையில் 2 உரையாடல் சுற்றுகள் ஒன்றிணையும், ஆனால் rubric நிலை சாளரங்களுக்கு இடையில் பாதுகாக்கப்படும்
  - நீங்கள் {window_idx} வது சாளரத்தை மதிப்பிட்டு வருகிறீர்கள் (இந்த பணிக்காக மொத்தம் {total_windows} சாளரங்கள்)
  - <window_content> தற்போதைய சாளரத்தின் உரையாடல் உள்ளடக்கத்தைக் கொண்டுள்ளது
  - <current_rubrics> தற்போதைய அனைத்து மதிப்பெண் புள்ளிகளின் நிலையைக் கொண்டுள்ளது (true என்பது பூர்த்தி செய்யப்பட்டது, false என்பது பூர்த்தி செய்யப்படவில்லை, அனைத்து மதிப்பெண் புள்ளிகளின் ஆரம்ப நிலை false ஆகும்)

  # பணி
  - தற்போதைய சாளரத்தின் உரையாடல் உள்ளடக்கத்தின் அடிப்படையில், மதிப்பெண் புள்ளி rubric நிலையை புதுப்பிக்கவும்
  - உதவியாளர் இந்த சாளரத்தில் இலக்கை முடித்தால் மட்டுமே, நீங்கள் நிலையை false இருந்து true ஆக புதுப்பிக்கலாம்
  - உதவியாளர் இந்த சாளரத்தில் முந்தைய சரியான முடிவை மாற்றினால் மட்டுமே, நீங்கள் true ஐ மீண்டும் false ஆக புதுப்பிக்கலாம் (ஆனால் கவனிக்கவும்: பயனர் தேவைகளே மாறினால், உதாரணமாக ஆர்டர் செய்த பிறகு தானாகவே ரத்து செய்தால், ஆர்டர் தேவைக்கான மூல மதிப்பீட்டை மாற்றக்கூடாது)
  - தேவையற்ற மாற்றங்களைத் தவிர்க்க, தற்போதைய உரையாடல் சாளரத்தின் முன்னேற்றத்தைப் பெற "பயனரின் முழுமையான வழிமுறை" ஐ நீங்கள் குறிக்கலாம்

  # கவனிக்க வேண்டியவை
  - முக்கியம்: அனைத்து மதிப்பீடுகளும் உதவியாளரின் பதில் மற்றும் கருவி அழைப்பு கோரிக்கைகள் rubric இல் உள்ள இலக்கை முடித்ததா என்பதை அடிப்படையாகக் கொண்டது, உரையாடலில் பயனர் வெளிப்படுத்தும் உள்ளடக்கம் உதவியாளருக்கான குறிப்பு மற்றும் வழிகாட்டுதலாக மட்டுமே கருதப்படும், மதிப்பீட்டு நிலைகளை நேரடியாக பாதிக்காது, அனைத்தும் rubric புலங்களை அடிப்படையாகக் கொண்டது!
  - முக்கியம்: வினவல் வகை tool திரும்பும் முடிவுகள் உதவியாளருக்கு மட்டுமே தெரியும், இது பயனருக்கு உதவியாளர் பரிந்துரைக்கும் உள்ளடக்கத்தை குறிக்காது, எனவே இது மதிப்பீட்டு முடிவை நேரடியாக பாதிக்காது, அனைத்தும் உதவியாளர் தகவலைப் பெற்ற பிறகு பயனருக்கு அளிக்கும் பதிலை அடிப்படையாகக் கொண்டது! அதே நேரத்தில், உதவியாளர் Tool இன் திரும்பும் முடிவுகளை உருவாக்கக்கூடாது என்பதையும் கவனிக்க வேண்டும்!
  - முக்கியம்: ஆர்டர் வகை rubric க்கு (ஆர்டர் விவரங்களை உள்ளடக்கியது, ஆர்டரை உருவாக்க வேண்டும்), உதவியாளர் உண்மையில் ஆர்டர் செயல்பாட்டை முடித்தாரா என உறுதிப்படுத்த வேண்டும். உதவியாளர் ஆர்டர் செயல்பாட்டை முடித்ததாக தவறாக நினைக்கலாம், உண்மையில் கருவி அழைப்பு தோல்வியடைந்திருக்கலாம்; அல்லது பயனர் "தானாக ஆர்டர் செய்யலாம்" என்று கூறும் நிலைகள் போன்றவை, அனைத்தும் தேவைகள் பூர்த்தி செய்யப்படவில்லை என கருதப்பட வேண்டும்
  - பொருள் அளவு, டெலிவரி நேரம் போன்ற ஆர்டர் விவரங்களை உள்ளடக்கிய rubric க்கு, அசல் rubric தேவைகளை கண்டிப்பாக பூர்த்தி செய்ய வேண்டும் (பொருள் அளவில் வேறுபாடு இருக்கக்கூடாது, எதிர்பார்க்கப்படும் டெலிவரி நேரத்தை விட தாமதமாக இருக்கக்கூடாது), பயனர் சமரசம் செய்யும் செயல்பாடுகள் மதிப்பீட்டு முடிவை பாதிக்காது (உதாரணமாக பயனர் "சில பொருட்கள் குறைவாக இருந்தாலும் பரவாயில்லை", "ஆர்டர் உள்ளடக்கத்தில் எந்த எதிர்ப்பும் இல்லை" அல்லது "தாமதமாக டெலிவரி செய்தாலும் பரவாயில்லை" என்று கூறுதல் போன்றவை), இத்தகைய நிலைகள் இன்னும் தேவைகள் பூர்த்தி செய்யப்படவில்லை என கருதப்பட வேண்டும்
  - உரை உள்ளடக்க பொருத்தமான முகவரி அல்லது ஆர்டர் குறிப்பு வகை rubric க்கு, செயல்பாட்டு சமநிலை கொள்கையைப் பயன்படுத்தவும்: உண்மையான உள்ளடக்கம் அதே செயல்பாட்டைச் செய்தால் (விநியோக இடத்தை தோராயமாக அடையாளம் காண்பது அல்லது வாடிக்கையாளரின் முதன்மை தேவைகளை 전달 செய்வது போன்றவை), வெளிப்பாடு முழுமையாக ஒத்துப்போகாவிட்டாலும் அல்லது சில விவரங்கள் காணாமல் போனாலும், தேவைகள் பூர்த்தி செய்யப்பட்டதாக கருதப்படும்
  - தற்போதைய சாளரம் ஒரு குறிப்பிட்ட விதியை உள்ளடக்கவில்லை என்றால், அதன் அசல் நிலையை மாற்றாமல் வைத்திருக்கவும்; தற்போதைய சாளரம் ஒரு குறிப்பிட்ட விதியை உள்ளடக்கியது ஆனால் முழுமையாக தீர்மானிக்க முடியவில்லை என்றால், முக்கிய தகவலை justification இல் பதிவு செய்து பின்னர் தீர்மானிக்க வைக்கலாம்
  - justification இல் தற்போதைய rubric உடன் தொடர்புடைய முக்கிய தகவல் மற்றும் அதற்குரிய சுற்று [x] ஐ சேர்க்கும் வடிவத்தில் பதிவு செய்யவும், நிலை மாற்றம் நிகழ்ந்தால் காரணத்தையும் பதிவு செய்ய வேண்டும், சுருக்கமான மொழியைப் பயன்படுத்தவும், நிலை மாற்றப்படவில்லை என்றால், முந்தைய காரணத்தை மீண்டும் கூறவும்

  # வடிவமைப்பு தேவைகள்
  - உங்கள் பதில் ஒரு JSON பொருளாக இருக்க வேண்டும், பின்வரும் புலங்களைக் கொண்டிருக்க வேண்டும்:
  - `rubric_idx`: விதியின் தனித்துவமான அடையாளம்
  - `rubric`: விதியின் மறு கூற்றல்
  - `justification`: நிலை மாற்றத்திற்கான விளக்கம்
  - `meetExpectation`: புதுப்பிக்கப்பட்ட நிலை (true அல்லது false)

  # மாதிரி உள்ளீட்டு கட்டமைப்பு:
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # மாதிரி பதில் கட்டமைப்பு:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<விதியை மீண்டும் கூறு>",
        "justification": "<நிலை மாற்றத்திற்கான சுருக்கமான விளக்கம், சேர்க்கும் வடிவத்தில் பதிவு செய்யவும்>",
        "meetExpectation": <true or false>
    }},
    ...
  ]
  ```
telugu: |-
  # వ్యవస్థ సమాచారం
  {env_info}

  # వినియోగదారు పూర్తి సూచన
  {user_instruction}

  # నేపథ్య వివరణ
  - ఇది వినియోగదారు మరియు అసిస్టెంట్ మధ్య సంభాషణ దృశ్యం, ఇక్కడ అసిస్టెంట్ సమాచారాన్ని పొందడానికి మరియు పనులను పూర్తి చేయడానికి సాధనాలను పిలవగలదు, సాధనం తిరిగి ఇచ్చే ఫలితాలు tool తో ప్రారంభమవుతాయి
  - మీరు వినియోగదారు సూచన పూర్తయిందో లేదో అంచనా వేయాలి, వినియోగదారు పూర్తి సూచన అనేక స్కోరింగ్ పాయింట్లు rubricలుగా విభజించబడింది, మీరు ప్రతి స్కోరింగ్ పాయింట్ సంతృప్తి చెందిందో లేదో మాత్రమే నిర్ణయించాలి
  - సంభాషణ టర్న్లు ఎక్కువగా ఉన్నందున, మేము స్లైడింగ్ విండో అంచనా పద్ధతిని ఉపయోగిస్తాము, అంటే ప్రతిసారీ 10 సంభాషణ టర్న్లు కనిపిస్తాయి, ప్రతి విండో మధ్య 2 సంభాషణ టర్న్లు ఓవర్‌ల్యాప్ అవుతాయి, కానీ rubric స్థితి విండోల అంతటా నిలుస్తుంది
  - మీరు {window_idx} వ విండోను అంచనా వేస్తున్నారు (ఈ పనికి మొత్తం {total_windows} విండోలు ఉన్నాయి)
  - <window_content> ప్రస్తుత విండో యొక్క సంభాషణ కంటెంట్‌ను కలిగి ఉంది
  - <current_rubrics> ప్రస్తుత అన్ని స్కోరింగ్ పాయింట్ల స్థితిని కలిగి ఉంది (true అంటే సంతృప్తి చెందింది, false అంటే సంతృప్తి చెందలేదు, అన్ని స్కోరింగ్ పాయింట్ల ప్రారంభ స్థితి false)

  # పని
  - ప్రస్తుత విండో యొక్క సంభాషణ కంటెంట్ ఆధారంగా, స్కోరింగ్ పాయింట్ rubric స్థితిని నవీకరించండి
  - మీరు స్థితిని false నుండి true కి నవీకరించవచ్చు, అది కూడా అసిస్టెంట్ ఈ విండోలో ఆ లక్ష్యాన్ని పూర్తి చేసినప్పుడు మాత్రమే
  - మీరు true ను మళ్లీ false కి నవీకరించవచ్చు, అది కూడా అసిస్టెంట్ ఈ విండోలో ముందు సరైన నిర్ధారణను తిరగరాసినప్పుడు మాత్రమే (కానీ గమనించండి: వినియోగదారు అవసరాలు స్వయంగా మారినట్లయితే, ఉదాహరణకు ఆర్డర్ చేసిన తర్వాత స్వయంగా రద్దు చేయడం, అప్పుడు ఆర్డర్ అవసరాల అంచనాను తిరగరాయకూడదు)
  - అనవసరమైన మార్పులను నివారించడానికి, ప్రస్తుత సంభాషణ విండో యొక్క ప్రగతిని తెలుసుకోవడానికి మీరు "వినియోగదారు పూర్తి సూచన"ను సూచనగా తీసుకోవచ్చు

  # గమనికలు
  - ముఖ్యం: అన్ని అంచనాలు అసిస్టెంట్ యొక్క స్పందన మరియు సాధన పిలుపు అభ్యర్థనలు rubricలోని లక్ష్యాలను పూర్తి చేశాయో లేదో అనే దానిపై ఆధారపడి ఉంటాయి, వినియోగదారు సంభాషణలో వ్యక్తపరిచిన కంటెంట్ కేవలం అసిస్టెంట్‌కు సూచన మరియు మార్గదర్శకంగా పరిగణించబడుతుంది, అంచనా ప్రమాణాలపై నేరుగా ప్రభావం చూపదు, అన్నీ rubric ఫీల్డ్‌పై ఆధారపడి ఉంటాయి!
  - ముఖ్యం: క్వెరీ రకం tool తిరిగి ఇచ్చే ఫలితాలు కేవలం అసిస్టెంట్‌కు కనిపిస్తాయి, ఇది వినియోగదారుకు అసిస్టెంట్ సిఫార్సు చేసిన కంటెంట్‌ను సూచించదు, కాబట్టి ఇది అంచనా ఫలితాలపై నేరుగా ప్రభావం చూపదు, అన్నీ అసిస్టెంట్ సమాచారాన్ని పొందిన తర్వాత వినియోగదారుకు ఇచ్చిన స్పందనపై ఆధారపడి ఉంటాయి! అదే సమయంలో, అసిస్టెంట్ Tool యొక్క తిరిగి వచ్చే ఫలితాలను కల్పించకూడదు అని గమనించాలి!
  - ముఖ్యం: ఆర్డర్ రకం rubricల కోసం (ఆర్డర్ వివరాలను కలిగి ఉంటుంది, ఆర్డర్‌ను సృష్టించాల్సి ఉంటుంది), అసిస్టెంట్ నిజంగా ఆర్డర్ చేసే పనిని పూర్తి చేసిందో లేదో నిర్ధారించుకోవాలి. అసిస్టెంట్ ఆర్డర్ చేసే పని పూర్తయిందని తప్పుగా భావించవచ్చు, వాస్తవానికి సాధన పిలుపు విఫలమైంది; లేదా వినియోగదారు "తాను ఆర్డర్ చేసుకోవచ్చు" అని చెప్పిన సందర్భాలు, అన్నీ అవసరాలు సంతృప్తి చెందలేదని పరిగణించాలి
  - వస్తువుల సంఖ్య, డెలివరీ సమయం వంటి ఆర్డర్ వివరాలను కలిగి ఉన్న rubricల కోసం, అసలు rubric అవసరాలను కఠినంగా పాటించాలి (వస్తువుల సంఖ్యలో తేడా ఉండకూడదు, అనుకున్న డెలివరీ సమయం కంటే ఆలస్యం కాకూడదు), వినియోగదారు రాజీ పడటం అంచనా ఫలితాన్ని ప్రభావితం చేయదు (ఉదాహరణకు వినియోగదారు "కొన్ని వస్తువులు తక్కువగా ఉన్నా పర్వాలేదు", "ఆర్డర్ కంటెంట్‌పై అభ్యంతరం లేదు" లేదా "ఆలస్యంగా డెలివరీ అయినా పర్వాలేదు" అని చెప్పినా), ఇటువంటి సందర్భాలు ఇప్పటికీ అవసరాలు సంతృప్తి చెందలేదని పరిగణించాలి
  - టెక్స్ట్ కంటెంట్ మ్యాచింగ్ చిరునామా లేదా ఆర్డర్ నోట్స్ రకం rubricల కోసం, ఫంక్షనల్ సమానత్వ సూత్రాన్ని ఉపయోగించండి: వాస్తవ కంటెంట్ ఒకే ఫంక్షన్‌ను సాధించగలిగితే (ఉదాహరణకు డెలివరీ స్థలాన్ని సుమారుగా గుర్తించడం లేదా కస్టమర్ యొక్క ప్రధాన అవసరాలను తెలియజేయడం), వ్యక్తీకరణ పూర్తిగా సరిపోలకపోయినా లేదా కొన్ని వివరాలు లేకపోయినా, అవసరాలు సంతృప్తి చెందాయని పరిగణించాలి
  - ప్రస్తుత విండోలో ఏదైనా నియమం ఉన్నట్లయితే, దాని అసలు స్థితిని మార్చకుండా ఉంచండి; ప్రస్తుత విండోలో ఏదైనా నియమం ఉంది కానీ పూర్తిగా నిర్ణయించలేకపోతే, కీలక సమాచారాను justificationలో నమోదు చేసి తర్వాతి నిర్ణయం కోసం వదిలివేయవచ్చు
  - justificationలో ప్రస్తుత rubricకు సంబంధించిన కీలక సమాచారం మరియు దానికి సంబంధించిన టర్న్ [x]ను జోడించే రూపంలో నమోదు చేయండి, స్థితి మార్పు జరిగితే కారణాన్ని కూడా నమోదు చేయాలి, సంక్షిప్త భాషను ఉపయోగించండి, స్థితి మారకపోతే, గత కారణాన్ని పునరావృతం చేయండి

  # ఫార్మాట్ అవసరాలు
  - మీ స్పందన ఒక JSON ఆబ్జెక్ట్‌గా ఉండాలి, ఇది క్రింది ఫీల్డ్‌లను కలిగి ఉంటుంది:
  - `rubric_idx`: నియమం యొక్క ప్రత్యేక గుర్తింపు
  - `rubric`: నియమం యొక్క పునరావృతం
  - `justification`: స్థితి మార్పుకు వివరణ
  - `meetExpectation`: నవీకరించిన స్థితి (true లేదా false)

  # ఉదాహరణ ఇన్‌పుట్ నిర్మాణం:
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # ఉదాహరణ స్పందన నిర్మాణం:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<నియమం పునరావృతం>",
        "justification": "<స్థితి మార్పుకు సంక్షిప్త వివరణ, జోడించే రూపంలో నమోదు చేయండి>",
        "meetExpectation": <true లేదా false>
    }},
    ...
  ]
  ```
