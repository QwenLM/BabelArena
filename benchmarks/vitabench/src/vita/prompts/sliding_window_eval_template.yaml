burmese: |-
  # စနစ်ဆိုင်ရာ အချက်အလက်
  {env_info}

  # အသုံးပြုသူ၏ စုံလင်သော ညွှန်ကြားချက်
  {user_instruction}

  # နောက်ခံရှင်းလင်းချက်
  - ၎င်းသည် user နှင့် assistant အကြား ဆွေးနွေးပြောဆိုမှု ပုံစံဖြစ်ပြီး assistant သည် အချက်အလက်ရယူရန်နှင့် လုပ်ဆောင်ချက်များ ပြီးမြောက်စေရန် tool များကို ခေါ်ယူအသုံးပြုနိုင်ကာ tool မှ ပြန်လည်ရရှိသော ရလဒ်များသည် tool ဖြင့် စတင်ပါမည်
  - သင်သည် အသုံးပြုသူ၏ ညွှန်ကြားချက်များ ပြီးမြောက်မှုရှိမရှိ အကဲဖြတ်ရမည်ဖြစ်ပြီး အသုံးပြုသူ၏ စုံလင်သော ညွှန်ကြားချက်ကို အမှတ်ရယူနိုင်သော အချက်များ (rubric) အများအပြားအဖြစ် ခွဲခြားထားသည်၊ သင်သည် အမှတ်ရယူနိုင်သော အချက်တစ်ခုချင်းစီ ပြည့်မီမှုရှိမရှိကိုသာ ဆုံးဖြတ်ရမည်
  - ဆွေးနွေးပြောဆိုမှု အလှည့်အများပြားသောကြောင့် ကျွန်ုပ်တို့သည် Sliding Window အကဲဖြတ်နည်းလမ်းကို အသုံးပြုသည်၊ ဆိုလိုသည်မှာ တစ်ကြိမ်လျှင် ဆွေးနွေးပြောဆိုမှု ၁၀ လှည့်ကို မြင်တွေ့ရမည်ဖြစ်ပြီး နေရာတစ်ခုနှင့် တစ်ခုကြားတွင် ဆွေးနွေးပြောဆိုမှု ၂ လှည့် ထပ်နေပါမည်၊ သို့သော် rubric အခြေအနေသည် နေရာများကို ဖြတ်ကျော်၍ သိမ်းဆည်းထားမည်ဖြစ်သည်
  - သင်သည် {window_idx} မြောက် နေရာကို အကဲဖြတ်နေခြင်းဖြစ်သည် (ယခုတာဝန်တွင် စုစုပေါင်း {total_windows} ခု ရှိသည်)
  - <window_content> တွင် လက်ရှိနေရာ၏ ဆွေးနွေးပြောဆိုမှု အကြောင်းအရာများ ပါဝင်သည်
  - <current_rubrics> တွင် လက်ရှိအမှတ်ရယူနိုင်သော အချက်အားလုံး၏ အခြေအနေများ ပါဝင်သည် (true သည် ပြည့်မီကြောင်း ပြသသည်၊ false သည် မပြည့်မီကြောင်း ပြသသည်၊ အမှတ်ရယူနိုင်သော အချက်အားလုံး၏ ကနဦးအခြေအနေများသည် false ဖြစ်သည်)

  # တာဝန်
  - လက်ရှိနေရာ၏ ဆွေးနွေးပြောဆိုမှု အကြောင်းအရာများအပေါ် အခြေခံ၍ အမှတ်ရယူနိုင်သော rubric ၏ အခြေအနေကို အပ်ဒိတ်လုပ်ပါ
  - assistant သည် ဤနေရာတွင် ရည်မှန်းချက်ကို ပြီးမြောက်စေမှသာ သင်သည် အခြေအနေကို false မှ true သို့ အပ်ဒိတ်လုပ်နိုင်သည်
  - assistant သည် ဤနေရာတွင် ယခင်က မှန်ကန်သော ကောက်ချက်ကို ပယ်ဖျက်မှသာ သင်သည် true ကို ထပ်မံ၍ false သို့ အပ်ဒိတ်လုပ်နိုင်သည် (သို့သော် သတိပြုရန် - အကယ်၍ အသုံးပြုသူ၏ လိုအပ်ချက်ကိုယ်တိုင် ပြောင်းလဲသွားပါက၊ ဥပမာ အော်ဒါတင်ပြီးနောက် ကိုယ်တိုင် ပယ်ဖျက်ခြင်းမျိုးဖြစ်ပါက အော်ဒါတင်လိုအပ်ချက်အပေါ် မူလအကဲဖြတ်ချက်ကို ပယ်ဖျက်သင့်မည် မဟုတ်ပါ)
  - မလိုအပ်သော ပြင်ဆင်မှုများ မဖြစ်ပေါ်စေရန် လက်ရှိဆွေးနွေးပြောဆိုမှု နေရာ၏ တိုးတက်မှုကို ရယူရန် "အသုံးပြုသူ၏ စုံလင်သော ညွှန်ကြားချက်" ကို ကိုးကားနိုင်သည်

  # သတိပြုရန် အချက်များ
  - အရေးကြီးသည် - အကဲဖြတ်ချက်အားလုံးသည် assistant ၏ ပြန်လည်ဖြေကြားချက်နှင့် tool ခေါ်ယူအသုံးပြုမှု တောင်းဆိုချက်များသည် rubric ရှိ ရည်မှန်းချက်များကို ပြီးမြောက်စေခြင်း ရှိမရှိအပေါ် မူတည်သည်၊ user ၏ ဆွေးနွေးပြောဆိုမှုတွင် ဖော်ပြထားသော အကြောင်းအရာများကို assistant အတွက် အကြံပြုချက်နှင့် လမ်းညွှန်မှုများအဖြစ်သာ သတ်မှတ်ပြီး အကဲဖြတ်မှု စံနှုန်းများကို တိုက်ရိုက်မသက်ရောက်စေပါ၊ အားလုံးသည် rubric ကွက်လပ်များအပေါ် မူတည်သည်!
  - အရေးကြီးသည် - မေးမြန်းခြင်းဆိုင်ရာ tool မှ ပြန်လည်ရရှိသော ရလဒ်များသည် assistant အတွက်သာ မြင်တွေ့နိုင်ပြီး assistant ၏ အသုံးပြုသူအတွက် အကြံပြုထားသော အကြောင်းအရာကို ကိုယ်စားမပြုပါ၊ ထို့ကြောင့် အကဲဖြတ်မှု ရလဒ်ကိုလည်း တိုက်ရိုက်မသက်ရောက်စေပါ၊ အားလုံးသည် assistant က အချက်အလက်ရယူပြီးနောက် အသုံးပြုသူအား ပြန်လည်ဖြေကြားချက်အပေါ် မူတည်ရမည်! ထို့အပြင် Assistant သည် Tool ၏ ပြန်လည်ရရှိသော ရလဒ်များကိုလည်း ဖန်တီးယူ၍ မရနိုင်ကြောင်း သတိပြုရမည်!
  - အရေးကြီးသည် - အော်ဒါအမျိုးအစား rubric များအတွက် (အော်ဒါ အသေးစိတ်အချက်အလက်များ ပါဝင်ပြီး အော်ဒါတင်ရန် လိုအပ်သော)၊ assistant သည် အော်ဒါတင်ခြင်း လုပ်ဆောင်ချက်ကို တကယ် ပြီးမြောက်စေခဲ့ခြင်း ရှိမရှိကို အတည်ပြုရမည်။ assistant သည် အော်ဒါတင်ခြင်း လုပ်ဆောင်ချက်ကို ပြီးမြောက်ခဲ့သည်ဟု အမှားယွင်းစွာ ယူဆနိုင်ပြီး တကယ်တမ်းတွင် tool ခေါ်ယူအသုံးပြုမှု ကျရှုံးနိုင်သည်؛ သို့မဟုတ် user က "ကိုယ်တိုင် အော်ဒါတင်နိုင်သည်" ဟု ပြောဆိုခြင်းမျိုးများကိုလည်း လိုအပ်ချက် မပြည့်မီသေးသည်ဟု သတ်မှတ်သင့်သည်
  - ကုန်ပစ္စည်း အရေအတွက်၊ ပို့ဆောင်ရေး အချိန်ကဲ့သို့သော အော်ဒါ အသေးစိတ်အချက်အလက်များ ပါဝင်သော rubric များအတွက် မူလ rubric လိုအပ်ချက်များကို တိကျစွာ ပြည့်မီရမည် (ကုန်ပစ္စည်း အရေအတွက် ကွဲလွဲမှု မရှိရ၊ မျှော်လင့်ထားသော ပို့ဆောင်ရေး အချိန်ထက် နောက်ကျမရ)၊ အသုံးပြုသူ၏ လျှော့ချပေးမှုများသည် အကဲဖြတ်မှု ရလဒ်ကို မသက်ရောက်စေပါ (ဥပမာ user က "ကုန်ပစ္စည်းတစ်ခုခု နည်းနည်းလျှော့လည်းရသည်"၊ "အော်ဒါ အကြောင်းအရာကို သဘောတူသည်" သို့မဟုတ် "နောက်ကျ ပို့ဆောင်လည်းရသည်" ဟု ပြောဆိုခြင်းများ)၊ ထိုကဲ့သို့သော အခြေအနေများကို လိုအပ်ချက် မပြည့်မီသေးသည်ဟုသာ ဆက်လက် သတ်မှတ်သင့်သည်
  - စာသား အကြောင်းအရာ ကိုက်ညီမှုပါဝင်သော လိပ်စာ သို့မဟုတ် အော်ဒါ မှတ်ချက်အမျိုးအစား rubric များအတွက် လုပ်ဆောင်ချက် ညီမျှမှု မူဝါဒကို အသုံးပြုပါ - လက်တွေ့အကြောင်းအရာသည် တူညီသော လုပ်ဆောင်ချက်ကို ဆောင်ရွက်နိုင်ပါက (ဥပမာ ပို့ဆောင်ရေး နေရာကို ခန့်မှန်းတွက်ချက်ခြင်း သို့မဟုတ် ဝယ်ယူသူ၏ အဓိက လိုအပ်ချက်များကို ထုတ်ဖော်ပြသခြင်း)၊ ဖော်ပြချက်သည် လုံးဝတူညီခြင်း မရှိဘဲ သို့မဟုတ် အသေးစိတ်အချက်အလက်များ လိုအပ်နေပါကလည်း လိုအပ်ချက် ပြည့်မီသည်ဟု သတ်မှတ်သည်
  - အကယ်၍ လက်ရှိနေရာတွင် စည်းမျဉ်းတစ်ခုခုကို မပါဝင်ပါက ၎င်း၏ မူလအခြေအနေအတိုင်း ထားရှိပါ; အကယ်၍ လက်ရှိနေရာတွင် စည်းမျဉ်းတစ်ခုခု ပါဝင်သော်လည်း လုံးဝဆုံးဖြတ်၍ မရနိုင်ပါက အဓိက အချက်အလက်များကို justification တွင် မှတ်တမ်းတင်ထားပြီး နောက်ပိုင်းတွင် ဆုံးဖြတ်ရန် ချန်ထားနိုင်သည်
  - justification တွင် လက်ရှိ rubric နှင့် သက်ဆိုင်သော အဓိက အချက်အလက်များနှင့် ၎င်းတို့၏ သက်ဆိုင်ရာ အလှည့်များ [x] ကို ထပ်မံဖြည့်စွက်သော ပုံစံဖြင့် မှတ်တမ်းတင်ပါ၊ အကယ်၍ အခြေအနေ ပြင်ဆင်မှု ဖြစ်ပေါ်ပါက အကြောင်းရင်းကိုလည်း မှတ်တမ်းတင်ရမည်၊ တိုတိုနှင့် ထိထိမိမိ ဘာသာစကားကို အသုံးပြုပါ၊ အကယ်၍ အခြေအနေ မပြင်ဆင်ပါက ယခင်အကြောင်းရင်းကို ပြန်လည်ဖော်ပြပါ

  # ပုံစံလိုအပ်ချက်များ
  - သင်၏ ပြန်လည်ဖြေကြားချက်သည် JSON အရာဝတ္ထုတစ်ခု ဖြစ်သင့်ပြီး အောက်ပါ ကွက်လပ်များ ပါဝင်သည် -
  - `rubric_idx` - စည်းမျဉ်း၏ တစ်ခုတည်းသော အမှတ်အသား
  - `rubric` - စည်းမျဉ်းကို ပြန်လည်ဖော်ပြချက်
  - `justification` - အခြေအနေ ပြောင်းလဲမှုအပေါ် ရှင်းလင်းချက်
  - `meetExpectation` - အပ်ဒိတ်လုပ်ပြီးနောက် အခြေအနေ (true သို့မဟုတ် false)

  # နမူနာ အင်ပုတ် တည်ဆောက်ပုံ -
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # နမူနာ ပြန်လည်ဖြေကြားချက် တည်ဆောက်ပုံ -
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<စည်းမျဉ်းကို ပြန်လည်ဖော်ပြချက်>",
        "justification": "<အခြေအနေ ပြောင်းလဲမှု၏ အကျဉ်းချုပ် ရှင်းလင်းချက်၊ ထပ်မံဖြည့်စွက်သော ပုံစံဖြင့် မှတ်တမ်းတင်သည်>",
        "meetExpectation": <true သို့မဟုတ် false>
    }},
    ...
  ]
  ```
lao: |-
  # ຂໍ້ມູນລະບົບ
  {env_info}

  # ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້
  {user_instruction}

  # ຄຳອະທິບາຍພື້ນຖານ
  - ນີ້ແມ່ນສາກການສົນທະນາລະຫວ່າງຜູ້ໃຊ້ ແລະ ຜູ້ຊ່ວຍ, ບ່ອນທີ່ຜູ້ຊ່ວຍສາມາດເອີ້ນໃຊ້ເຄື່ອງມືເພື່ອດຶງຂໍ້ມູນ ແລະ ດຳເນີນການ, ຜົນການຕອບກັບຂອງເຄື່ອງມືຈະເລີ່ມຕົ້ນດ້ວຍ tool
  - ທ່ານຕ້ອງປະເມີນວ່າຄຳສັ່ງຂອງຜູ້ໃຊ້ໄດ້ຖືກດຳເນີນການສຳເລັດຫຼືບໍ່, ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້ໄດ້ຖືກແຍກອອກເປັນຈຸດໃຫ້ຄະແນນ rubric ຈຳນວນໜຶ່ງ, ທ່ານພຽງແຕ່ຕ້ອງຕັດສິນວ່າແຕ່ລະຈຸດໃຫ້ຄະແນນໄດ້ຖືກຕອບສະໜອງຫຼືບໍ່
  - ເນື່ອງຈາກຈຳນວນຮອບການສົນທະນາມີຫຼາຍ, ພວກເຮົານຳໃຊ້ວິທີການປະເມີນແບບໜ້າຕ່າງເລື່ອນ, ນັ້ນແມ່ນແຕ່ລະຄັ້ງຈະເຫັນ 10 ຮອບການສົນທະນາ, ລະຫວ່າງແຕ່ລະໜ້າຕ່າງມີ 2 ຮອບການສົນທະນາຊ້ອນກັນ, ແຕ່ສະຖານະ rubric ຈະຖືກຮັກສາໄວ້ຂ້າມໜ້າຕ່າງ
  - ທ່ານກຳລັງປະເມີນໜ້າຕ່າງທີ {window_idx} (ວຽກງານນີ້ມີທັງໝົດ {total_windows} ໜ້າຕ່າງ)
  - <window_content> ປະກອບມີເນື້ອຫາການສົນທະນາຂອງໜ້າຕ່າງປະຈຸບັນ
  - <current_rubrics> ປະກອບມີສະຖານະຂອງຈຸດໃຫ້ຄະແນນທັງໝົດໃນປະຈຸບັນ (true ໝາຍຄວາມວ່າໄດ້ຖືກຕອບສະໜອງ, false ໝາຍຄວາມວ່າຍັງບໍ່ໄດ້ຖືກຕອບສະໜອງ, ສະຖານະເບື້ອງຕົ້ນຂອງຈຸດໃຫ້ຄະແນນທັງໝົດແມ່ນ false)

  # ພາລະກິດ
  - ອີງໃສ່ເນື້ອຫາການສົນທະນາຂອງໜ້າຕ່າງປະຈຸບັນ, ອັບເດດສະຖານະຂອງຈຸດໃຫ້ຄະແນນ rubric
  - ທ່ານສາມາດປ່ຽນສະຖານະຈາກ false ເປັນ true, ກໍຕໍ່ເມື່ອຜູ້ຊ່ວຍໄດ້ດຳເນີນການເປົ້າໝາຍນັ້ນສຳເລັດໃນໜ້າຕ່າງນີ້ເທົ່ານັ້ນ
  - ທ່ານຍັງສາມາດປ່ຽນ true ກັບມາເປັນ false ອີກຄັ້ງ, ກໍຕໍ່ເມື່ອຜູ້ຊ່ວຍໄດ້ລົບລ້າງສະຫຼຸບຜົນທີ່ຖືກຕ້ອງກ່ອນໜ້ານີ້ໃນໜ້າຕ່າງນີ້ເທົ່ານັ້ນ (ແຕ່ກະລຸນາສັງເກດ: ຖ້າຄວາມຕ້ອງການຂອງຜູ້ໃຊ້ປ່ຽນແປງເອງ, ຕົວຢ່າງເຊັ່ນ ການຍົກເລີກດ້ວຍຕົນເອງຫຼັງຈາກສັ່ງຊື້, ກໍບໍ່ຄວນລົບລ້າງການປະເມີນເດີມຕໍ່ຄວາມຕ້ອງການການສັ່ງຊື້)
  - ທ່ານສາມາດອ້າງອີງ "ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້" ເພື່ອຮັບຮູ້ຄວາມຄືບໜ້າຂອງໜ້າຕ່າງການສົນທະນາປະຈຸບັນ, ຫຼີກລ່ຽງການດັດແກ້ທີ່ບໍ່ຈຳເປັນ

  # ຂໍ້ຄວນລະວັງ
  - ສຳຄັນ: ການປະເມີນທັງໝົດອີງໃສ່ວ່າການຕອບກັບຂອງຜູ້ຊ່ວຍ ແລະ ຄຳຮ້ອງເອີ້ນໃຊ້ເຄື່ອງມືໄດ້ດຳເນີນການເປົ້າໝາຍໃນ rubric ສຳເລັດຫຼືບໍ່, ເນື້ອຫາທີ່ຜູ້ໃຊ້ສະແດງອອກໃນການສົນທະນາຖືເປັນພຽງແຕ່ຄຳແນະນຳ ແລະ ການຊີ້ນຳໃຫ້ຜູ້ຊ່ວຍ, ຈະບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ມາດຕະຖານການປະເມີນ, ທຸກຢ່າງອີງໃສ່ຊ່ອງ rubric ເປັນຫຼັກ!
  - ສຳຄັນ: ຜົນການຕອບກັບຂອງເຄື່ອງມືປະເພດຄົ້ນຫາ ຈະເຫັນໄດ້ສະເພາະຜູ້ຊ່ວຍເທົ່ານັ້ນ, ບໍ່ໄດ້ໝາຍຄວາມວ່າເປັນເນື້ອຫາທີ່ຜູ້ຊ່ວຍແນະນຳໃຫ້ຜູ້ໃຊ້, ດັ່ງນັ້ນຈຶ່ງບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ຜົນການປະເມີນ, ທຸກຢ່າງຕ້ອງອີງໃສ່ການຕອບກັບຂອງຜູ້ຊ່ວຍຕໍ່ຜູ້ໃຊ້ຫຼັງຈາກໄດ້ຮັບຂໍ້ມູນແລ້ວ! ພ້ອມກັນນັ້ນຕ້ອງສັງເກດວ່າ, ຜູ້ຊ່ວຍ ກໍບໍ່ສາມາດປະພັນຜົນການຕອບກັບຂອງເຄື່ອງມືໄດ້!
  - ສຳຄັນ: ສຳລັບ rubric ປະເພດຄຳສັ່ງຊື້ (ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້, ຕ້ອງສ້າງຄຳສັ່ງຊື້), ຕ້ອງຢືນຢັນວ່າຜູ້ຊ່ວຍໄດ້ດຳເນີນການສັ່ງຊື້ສຳເລັດແທ້ຫຼືບໍ່. ມັນອາດຈະເກີດຂຶ້ນທີ່ຜູ້ຊ່ວຍເຂົ້າໃຈຜິດວ່າໄດ້ດຳເນີນການສັ່ງຊື້ສຳເລັດແລ້ວ, ແຕ່ໃນຄວາມເປັນຈິງການເອີ້ນໃຊ້ເຄື່ອງມືລົ້ມເຫຼວ; ຫຼື ຜູ້ໃຊ້ລະບຸວ່າສາມາດ "ສັ່ງຊື້ເອງໄດ້" ແລະ ສະຖານະອື່ນໆ, ຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບ rubric ທີ່ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້ເຊັ່ນ ຈຳນວນສິນຄ້າ, ເວລາສົ່ງ, ຕ້ອງຕອບສະໜອງຄວາມຕ້ອງງານຂອງ rubric ດັ້ງເດີມຢ່າງເຂັ້ມງວດ (ບໍ່ສາມາດມີຄວາມຜິດພາດຂອງຈຳນວນສິນຄ້າ, ບໍ່ສາມາດສົ່ງຊ້າກວ່າເວລາທີ່ຄາດຫວັງ), ການປະນີປະນອມຂອງຜູ້ໃຊ້ບໍ່ສົ່ງຜົນຕໍ່ຜົນການຕັດສິນ (ຕົວຢ່າງ ຜູ້ໃຊ້ລະບຸວ່າ "ສິນຄ້າຊະນິດໃດໜຶ່ງໜ້ອຍກໍໄດ້", "ບໍ່ມີຄຳຄັດຄ້ານຕໍ່ເນື້ອຫາຄຳສັ່ງຊື້" ຫຼື "ສົ່ງຊ້າກໍໄດ້" ແລະ ອື່ນໆ), ສະຖານະແບບນີ້ຍັງຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບ rubric ປະເພດທີ່ຢູ່ ຫຼື ໝາຍເຫດຄຳສັ່ງຊື້ທີ່ກ່ຽວຂ້ອງກັບການຈັບຄູ່ເນື້ອຫາຂໍ້ຄວາມ, ນຳໃຊ້ຫຼັກການທຽບເທົ່າທາງໜ້າທີ່: ຕາບໃດທີ່ເນື້ອຫາຕົວຈິງສາມາດບັນລຸໜ້າທີ່ດຽວກັນ (ເຊັ່ນ ການລະບຸຕຳແໜ່ງຈັດສົ່ງໂດຍປະມານ ຫຼື ສື່ສານຄວາມຕ້ອງການຫຼັກຂອງລູກຄ້າ), ເຖິງແມ່ນວ່າການສະແດງອອກຈະບໍ່ຄືກັນສົມບູນ ຫຼື ຂາດລາຍລະອຽດບາງສ່ວນ, ກໍຖືວ່າຕອບສະໜອງຄວາມຕ້ອງການ
  - ຖ້າໜ້າຕ່າງປະຈຸບັນບໍ່ກ່ຽວຂ້ອງກັບກົດລະບຽບໃດໜຶ່ງ, ຮັກສາສະຖານະເດີມໄວ້; ຖ້າໜ້າຕ່າງປະຈຸບັນກ່ຽວຂ້ອງກັບກົດລະບຽບໃດໜຶ່ງແຕ່ບໍ່ສາມາດຕັດສິນໄດ້ຢ່າງສົມບູນ, ສາມາດບັນທຶກຂໍ້ມູນສຳຄັນໃນ justification ເພື່ອລໍຖ້າການຕັດສິນໃນພາຍຫຼັງ
  - ໃນ justification ໃຫ້ບັນທຶກຂໍ້ມູນສຳຄັນທີ່ກ່ຽວຂ້ອງກັບ rubric ປະຈຸບັນ ແລະ ຮອບທີ່ກົງກັນ [x] ໃນຮູບແບບການເພີ່ມເຕີມ, ຖ້າເກີດການປ່ຽນແປງສະຖານະກໍຕ້ອງບັນທຶກເຫດຜົນ, ໃຊ້ພາສາທີ່ກະທັດຮັດ, ຖ້າສະຖານະບໍ່ໄດ້ປ່ຽນແປງ, ໃຫ້ກ່າວຊ້ຳເຫດຜົນຄັ້ງກ່ອນ

  # ຄວາມຕ້ອງການຮູບແບບ
  - ການຕອບກັບຂອງທ່ານຄວນເປັນວັດຖຸ JSON, ປະກອບມີຊ່ອງດັ່ງລຸ່ມນີ້:
  - `rubric_idx`: ຕົວລະບຸເອກະລັກຂອງກົດລະບຽບ
  - `rubric`: ການກ່າວຊ້າກົດລະບຽບ
  - `justification`: ຄຳອະທິບາຍກ່ຽວກັບການປ່ຽນແປງສະຖານະ
  - `meetExpectation`: ສະຖານະຫຼັງຈາກອັບເດດ (true ຫຼື false)

  # ໂຄງສ້າງຕົວຢ່າງການປ້ອນຂໍ້ມູນ:
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # ໂຄງສ້າງຕົວຢ່າງການຕອບກັບ:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<ກ່າວຊ້າກົດລະບຽບ>",
        "justification": "<ຄຳອະທິບາຍໂດຍຫຍໍ້ກ່ຽວກັບການປ່ຽນແປງສະຖານະ, ບັນທຶກໃນຮູບແບບການເພີ່ມເຕີມ>",
        "meetExpectation": <true or false>
    }},
    ...
  ]
