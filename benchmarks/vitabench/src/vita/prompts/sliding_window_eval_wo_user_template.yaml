  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<ការរៀបរាប់ឡើងវិញនៃវិធានការ>",
        "justification": "<ការពន្យល់សង្ខេបអំពីការផ្លាស់ប្តូរស្ថានភាព កត់ត្រាជាទម្រង់បន្ថែម>",
        "meetExpectation": <true ឬ false>
    }},
    ...
  ]
  ```
burmese: |-
  # စနစ်ဆိုင်ရာ အချက်အလက်
  {env_info}

  # အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်
  {user_instruction}

  # နောက်ခံရှင်းလင်းချက်
  - ၎င်းသည် assistant တစ်ခုက user ၏ညွှန်ကြားချက်ကို ပြီးမြောက်စေသည့် လုပ်ငန်းစဉ်ဖြစ်ပြီး၊ assistant သည် အချက်အလက်ရယူရန်နှင့် လုပ်ဆောင်ချက်များ ပြီးမြောက်စေရန် ကိရိယာများကို ခေါ်ယူအသုံးပြုနိုင်ကာ ကိရိယာမှ ပြန်လည်ပေးပို့သော ရလဒ်များသည် tool ဖြင့် စတင်ပါမည်
  - ဤလုပ်ငန်းစဉ်သည် assistant နှင့် user တို့ ဆွေးနွေးပြောဆိုမှုတွင် ပြီးမြောက်သည်၊ user ၏ တုံ့ပြန်မှုများက အကဲဖြတ်ရလဒ်များကို ထိခိုက်စေခြင်းမှ ရှောင်ကြဉ်ရန်အတွက် user ၏ တုံ့ပြန်မှုအကြောင်းအရာကို ဖုံးကွယ်ထားပြီး၊ သင်သည် assistant ၏ တုံ့ပြန်မှုအကြောင်းအရာကိုသာ အာရုံစိုက်ရမည်ဖြစ်ကာ အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက် ပြီးမြောက်မှုရှိမရှိကို အကဲဖြတ်ရမည်
  - အကဲဖြတ်ရန် လွယ်ကူစေရန်အတွက် အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်ကို အမှတ်ရယူနိုင်သည့် အချက်များ (rubric) အများအပြားအဖြစ် ခွဲခြားထားပြီး၊ သင်သည် အမှတ်ရယူနိုင်သည့် အချက်တစ်ခုချင်းစီ ပြည့်မီမှုရှိမရှိကိုသာ ဆုံးဖြတ်ရမည်
  - လုပ်ငန်းတာဝန် အလှည့်အပတ်များသောကြောင့်၊ ကျွန်ုပ်တို့သည် ရွေ့လျားသည့် ပြတင်းပေါင်း (sliding window) အကဲဖြတ်နည်းကို အသုံးပြုသည်၊ ဆိုလိုသည်မှာ တစ်ကြိမ်လျှင် အလှည့် ၁၀ ခုကို မြင်တွေ့ရပြီး၊ ပြတင်းပေါင်းတစ်ခုနှင့်တစ်ခုကြားတွင် အလှည့် ၂ ခု ထပ်နေသော်လည်း rubric အခြေအနေသည် ပြတင်းပေါင်းများကို ဖြတ်ကျော်၍ သိမ်းဆည်းထားမည်ဖြစ်သည်
  - သင်သည် {window_idx} မြောက် ပြတင်းပေါင်းကို အကဲဖြတ်နေခြင်းဖြစ်သည် (ဤလုပ်ငန်းတာဝန်အတွက် စုစုပေါင်း {total_windows} ခုရှိသည်)
  - <window_content> တွင် လက်ရှိပြတင်းပေါင်း၏ လုပ်ငန်းတာဝန် တိုးတက်မှုအခြေအနေ ပါဝင်သည်
  - <current_rubrics> တွင် လက်ရှိအမှတ်ရယူနိုင်သည့် အချက်အားလုံး၏ အခြေအနေများ ပါဝင်သည် (true သည် ပြည့်မီကြောင်း ပြသပြီး၊ false သည် မပြည့်မီကြောင်း ပြသသည်၊ အမှတ်ရယူနိုင်သည့် အချက်အားလုံး၏ ကနဦးအခြေအနေများသည် false ဖြစ်သည်)

  # လုပ်ငန်းတာဝန်
  - လက်ရှိပြတင်းပေါင်း၏ လုပ်ငန်းတာဝန် တိုးတက်မှုအခြေအနေအပေါ် အခြေခံ၍ အမှတ်ရယူနိုင်သည့် rubric အခြေအနေကို အပ်ဒိတ်လုပ်ပါ
  - assistant သည် ဤပြတင်းပေါင်းတွင် ဤရည်မှန်းချက်ကို ပြီးမြောက်စေမှသာလျှင် သင်သည် အခြေအနေကို false မှ true သို့ အပ်ဒိတ်လုပ်နိုင်သည်
  - assistant သည် ဤပြတင်းပေါင်းတွင် ယခင်က မှန်ကန်သော ကောက်ချက်ကို ပယ်ဖျက်မှသာလျှင် သင်သည် true ကို ထပ်မံ၍ false သို့ အပ်ဒိတ်လုပ်နိုင်သည် (သတိပြုရန် - အကယ်၍ အသုံးပြုသူ၏ လိုအပ်ချက်ကိုယ်တိုင် ပြောင်းလဲသွားပါက၊ ဥပမာ - အော်ဒါတင်ပြီးနောက် ကိုယ်တိုင် ပယ်ဖျက်ခြင်းမျိုးဖြစ်ပါက၊ မူလအော်ဒါတင်လိုအပ်ချက်အပေါ် အကဲဖြတ်ချက်ကို ပယ်ဖျက်သင့်သည်မဟုတ်ပါ)
  - မလိုအပ်သော ပြင်ဆင်မှုများ မဖြစ်ပေါ်စေရန်အတွက် လက်ရှိဆွေးနွေးမှု ပြတင်းပေါင်း၏ တိုးတက်မှုကို ရယူရန် "အသုံးပြုသူ၏ လုံးဝညွှန်ကြားချက်" ကို ကိုးကားနိုင်သည်

  # သတိပြုရန် အချက်များ
  - အရေးကြီးသည် - အကဲဖြတ်မှုအားလုံးသည် assistant ၏ တုံ့ပြန်မှုနှင့် ကိရိယာခေါ်ယူမှု လိုအပ်ချက်များက rubric ရှိ ရည်မှန်းချက်များကို ပြီးမြောက်စေမှုအပေါ် အခြေခံသည်၊ user က ဆွေးနွေးမှုတွင် assistant ထံ သတင်းပို့သော အကြောင်းအရာများကို assistant အတွက် အကြံပြုချက်နှင့် လမ်းညွှန်မှုများအဖြစ်သာ သတ်မှတ်သည်၊ အကဲဖြတ်မှု စံနှုန်းများကို တိုက်ရိုက်မသက်ရောက်စေပါ၊ အားလုံးသည် rubric ဖီးလ်ဒ်အပေါ်တွင်သာ မူတည်သည်!
  - အရေးကြီးသည် - စုံစမ်းမှုအမျိုးအစား tool မှ ပြန်လည်ပေးပို့သော ရလဒ်များသည် assistant အတွက်သာ မြင်တွေ့ရပြီး၊ assistant က user အတွက် အကြံပြုသော အကြောင်းအရာကို ကိုယ်စားမပြုပါ၊ ထို့ကြောင့် အကဲဖြတ်ရလဒ်ကိုလည်း တိုက်ရိုက်မသက်ရောက်စေပါ၊ အားလုံးသည် assistant က အချက်အလက်ရယူပြီးနောက် user အား ပြန်လည်တုံ့ပြန်မှုအပေါ်တွင်သာ မူတည်ရမည်!
  - အရေးကြီးသည် - အော်ဒါအမျိုးအစား rubric များအတွက် (အော်ဒါအသေးစိတ်အချက်အလက်များ ပါဝင်ပြီး၊ အော်ဒါဖန်တီးရန် လိုအပ်သော)၊ assistant သည် အော်ဒါတင်ခြင်း လုပ်ဆောင်ချက်ကို တကယ်ပင် ပြီးမြောက်စေခဲ့ခြင်း ရှိမရှိကို အတည်ပြုရမည်။ assistant သည် အော်ဒါတင်ခြင်း လုပ်ဆောင်ချက်ကို ပြီးမြောက်ခဲ့သည်ဟု အမှားယွင်းယူဆနိုင်ပြီး၊ တကယ်တမ်းတွင် ကိရိယာခေါ်ယူမှု ကျရှုံးနိုင်သည်؛ သို့မဟုတ် user က "ကိုယ်တိုင် အော်ဒါတင်နိုင်သည်" ဟု ပြောဆိုခြင်းမျိုးရှိပါက၊ ထိုကဲ့သို့သော အခြေအနေများကို အားလုံးကို လိုအပ်ချက်မပြည့်မီဟု သတ်မှတ်သင့်သည်
  - ကုန်ပစ္စည်းအရေအတွက်၊ ပို့ဆောင်ချိန်ကဲ့သို့သော အော်ဒါအသေးစိတ်အချက်အလက်များ ပါဝင်သည့် rubric များအတွက်၊ မူလ rubric လိုအပ်ချက်များကို တိကျစွာ ပြည့်မီရမည် (ကုန်ပစ္စည်းအရေအတွက် ကွဲလွဲမှုမရှိရ၊ မျှော်လင့်ထားသော ပို့ဆောင်ချိန်ထက် နောက်ကျမရပါ)၊ အသုံးပြုသူ၏ လျှော့ချပေးမှုများက အကဲဖြတ်ရလဒ်ကို မသက်ရောက်စေပါ (ဥပမာ - user က "ကုန်ပစ္စည်းတစ်ခုခု နည်းနည်းလျှော့လည်းရသည်"၊ "အော်ဒါအကြောင်းအရာကို သဘောတူသည်" သို့မဟုတ် "နောက်ကျပို့ဆောင်လည်းရသည်" ဟု ပြောဆိုခြင်းမျိုး)၊ ထိုကဲ့သို့သော အခြေအနေများကို လိုအပ်ချက်မပြည့်မီဟု ဆက်လက်သတ်မှတ်သင့်သည်
  - စာသားအကြောင်းအရာ ကိုက်ညီမှုပါဝင်သော လိပ်စာ သို့မဟုတ် အော်ဒါမှတ်ချက်အမျိုးအစား rubric များအတွက်၊ လုပ်ဆောင်ချက် ညီမျှမှုမူဝါဒကို အသုံးပြုသည် - လက်တွေ့အကြောင်းအရာသည် တူညီသောလုပ်ဆောင်ချက်ကို ဆောင်ရွက်နိုင်ပါက (ဥပမာ - ပို့ဆောင်မည့်နေရာကို ခန့်မှန်းတွက်ချက်နိုင်ခြင်း သို့မဟုတ် ဝယ်ယူသူ၏ အဓိကလိုအပ်ချက်ကို ဆက်သွယ်ပြောကြားနိုင်ခြင်း)၊ ဖော်ပြချက် လုံးဝတူညီမှုမရှိခြင်း သို့မဟုတ် အသေးစိတ်အချက်အလက် အချို့ပါဝင်မှုနည်းပါးနေခြင်းရှိသော်လည်း၊ လိုအပ်ချက်ပြည့်မီသည်ဟု သတ်မှတ်သည်
  - အကယ်၍ လက်ရှိပြတင်းပေါင်းတွင် စည်းမျဉ်းတစ်ခုခုကို မပါဝင်စေပါက၊ ၎င်း၏ မူလအခြေအနေအတိုင်း ထားရှိပါ; အကယ်၍ လက်ရှိပြတင်းပေါင်းတွင် စည်းမျဉ်းတစ်ခုခုကို ပါဝင်စေသော်လည်း လုံးဝဆုံးဖြတ်၍မရနိုင်ပါက၊ အဓိကအချက်အလက်များကို justification တွင် မှတ်တမ်းတင်ထားပြီး နောက်ပိုင်းဆုံးဖြတ်ချက်အတွက် စောင့်ဆိုင်းနိုင်သည်
  - justification တွင် လက်ရှိ rubric နှင့် သက်ဆိုင်သော အဓိကအချက်အလက်များနှင့် ၎င်းတို့၏ သက်ဆိုင်ရာ အလှည့်များ [x] ကို ထပ်ပေါင်းသည့်ပုံစံဖြင့် မှတ်တမ်းတင်ပါ၊ အကယ်၍ အခြေအနေ ပြင်ဆင်မှုဖြစ်ပေါ်ပါက အကြောင်းရင်းကိုလည်း မှတ်တမ်းတင်ရမည်ဖြစ်ပြီး၊ တိုတိုနှင့် ထိရောက်သော ဘာသာစကားကို အသုံးပြုပါ

  # ပုံစံလိုအပ်ချက်များ
  - သင်၏ တုံ့ပြန်မှုသည် JSON အရာဝတ္ထုတစ်ခုဖြစ်သင့်ပြီး၊ အောက်ပါဖီးလ်ဒ်များ ပါဝင်သည် -
  - `rubric_idx` - စည်းမျဉ်း၏ ထူးခြားသော အမှတ်အသား
  - `rubric` - စည်းမျဉ်းကို ပြန်လည်ဖော်ပြချက်
  - `justification` - အခြေအနေပြောင်းလဲမှုအပေါ် ရှင်းလင်းချက်
  - `meetExpectation` - အပ်ဒိတ်လုပ်ပြီးနောက် အခြေအနေ (true သို့မဟုတ် false)

  # နမူနာ အင်ပုတ်ဖွဲ့စည်းပုံ -
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # နမူနာ တုံ့ပြန်မှုဖွဲ့စည်းပုံ -
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<复述规则>",
        "justification": "<状态变化的简要解释，以追加的形式记录>",
        "meetExpectation": <true or false>
    }},
    ...
  ]
  ```
lao: |-
  # ຂໍ້ມູນລະບົບ
  {env_info}

  # ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້
  {user_instruction}

  # ຄຳອະທິບາຍພື້ນຖານ
  - ນີ້ແມ່ນຂະບວນການທີ່ assistant ປະຕິບັດຄຳສັ່ງຂອງ user, ບ່ອນທີ່ assistant ສາມາດເອີ້ນໃຊ້ເຄື່ອງມືເພື່ອຮັບຂໍ້ມູນ ແລະ ດຳເນີນການ, ຜົນທີ່ໄດ້ຮັບຈາກເຄື່ອງມືຈະເລີ່ມຕົ້ນດ້ວຍ tool
  - ຂະບວນການນີ້ດຳເນີນການຜ່ານການສົນທະນາລະຫວ່າງ assistant ແລະ user, ເພື່ອຫຼີກລ່ຽງການລົບກວນຈາກການຕອບກັບຂອງ user ຕໍ່ຜົນການປະເມີນ, ເນື້ອຫາການຕອບກັບຂອງ user ຖືກຊ່ອນໄວ້, ທ່ານພຽງແຕ່ຕ້ອງເອົາໃຈໃສ່ເນື້ອຫາການຕອບກັບຂອງ assistant, ແລະ ປະເມີນວ່າຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້ໄດ້ຖືກປະຕິບັດຫຼືບໍ່
  - ເພື່ອຄວາມສະດວກໃນການປະເມີນ, ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້ໄດ້ຖືກແບ່ງອອກເປັນຈຸດໃຫ້ຄະແນນ rubric ຫຼາຍຈຸດ, ທ່ານພຽງແຕ່ຕ້ອງຕັດສິນວ່າແຕ່ລະຈຸດໃຫ້ຄະແນນໄດ້ຮັບການຕອບສະໜອງຫຼືບໍ່
  - ເນື່ອງຈາກຈຳນວນຮອບຂອງວຽກງານມີຫຼາຍ, ພວກເຮົານຳໃຊ້ວິທີການປະເມີນແບບ sliding window, ນັ້ນແມ່ນແຕ່ລະຄັ້ງຈະເຫັນ 10 ຮອບຂອງຜົນລັພธ์, ລະຫວ່າງແຕ່ລະ window ມີ 2 ຮອບຊ້ອນກັນ, ແຕ່ສະຖານະ rubric ຈະຖືກຮັກສາໄວ້ຂ້າມ window
  - ທ່ານກຳລັງປະເມີນ window ທີ່ {window_idx} (ວຽກງານນີ້ມີທັງໝົດ {total_windows} window)
  - `<window_content>` ປະກອບມີຄວາມຄືບໜ້າຂອງວຽກງານໃນ window ປັດຈຸບັນ
  - `<current_rubrics>` ປະກອບມີສະຖານະຂອງຈຸດໃຫ້ຄະແນນທັງໝົດໃນປັດຈຸບັນ (true ໝາຍຄວາມວ່າໄດ້ຮັບການຕອບສະໜອງແລ້ວ, false ໝາຍຄວາມວ່າຍັງບໍ່ໄດ້ຮັບການຕອບສະໜອງ, ສະຖານະເບື້ອງຕົ້ນຂອງຈຸດໃຫ້ຄະແນນທັງໝົດແມ່ນ false)

  # ວຽກງານ
  - ອີງໃສ່ຄວາມຄືບໜ້າຂອງວຽກງານໃນ window ປັດຈຸບັນ, ໃຫ້ອັບເດດສະຖານະຂອງຈຸດໃຫ້ຄະແນນ rubric
  - ທ່ານສາມາດປ່ຽນສະຖານະຈາກ false ເປັນ true, ກໍຕໍ່ເມື່ອ assistant ໄດ້ບັນລຸເປົ້າໝາຍນັ້ນໃນ window ນີ້ເທົ່ານັ້ນ
  - ທ່ານຍັງສາມາດປ່ຽນ true ກັບມາເປັນ false ອີກຄັ້ງ, ກໍຕໍ່ເມື່ອ assistant ໄດ້ລົບລ້າງສະຫຼຸບທີ່ຖືກຕ້ອງກ່ອນໜ້ານີ້ໃນ window ນີ້ເທົ່ານັ້ນ (ແຕ່ກະລຸນາສັງເກດ: ຖ້າຄວາມຕ້ອງການຂອງຜູ້ໃຊ້ປ່ຽນແປງເອງ, ຕົວຢ່າງເຊັ່ນ ຍົກເລີກການສັ່ງຊື້ດ້ວຍຕົນເອງຫຼັງຈາກສັ່ງຊື້, ກໍບໍ່ຄວນລົບລ້າງການປະເມີນຕໍ່ຄວາມຕ້ອງການການສັ່ງຊື້ເດີມ)
  - ທ່ານສາມາດອ້າງອີງ "ຄຳສັ່ງເຕັມຂອງຜູ້ໃຊ້" ເພື່ອຮັບຮູ້ຄວາມຄືບໜ້າຂອງ window ການສົນທະນາປັດຈຸບັນ, ເພື່ອຫຼີກລ່ຽງການດັດແກ້ທີ່ບໍ່ຈຳເປັນ

  # ຂໍ້ຄວນລະວັງ
  - ສຳຄັນ: ການປະເມີນທັງໝົດອີງໃສ່ການຕອບກັບຂອງ assistant ແລະ ຄຳຮ້ອງເອີ້ນໃຊ້ເຄື່ອງມືວ່າໄດ້ບັນລຸເປົ້າໝາຍໃນ rubric ຫຼືບໍ່, ເນື້ອຫາທີ່ user ສື່ສານໄປຫາ assistant ໃນການສົນທະນາຖືເປັນພຽງຄຳແນະນຳ ແລະ ການຊີ້ນຳສຳລັບ assistant, ຈະບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ມາດຕະຖານການປະເມີນ, ທຸກຢ່າງອີງໃສ່ຖານຂໍ້ມູນ rubric ເປັນຫຼັກ!
  - ສຳຄັນ: ຜົນທີ່ໄດ້ຮັບຈາກເຄື່ອງມືປະເພດຄົ້ນຫາ ຈະເຫັນໄດ້ສະເພາະ assistant ເທົ່ານັ້ນ, ບໍ່ໄດ້ໝາຍຄວາມວ່າເປັນເນື້ອຫາທີ່ assistant ແນະນຳໃຫ້ຜູ້ໃຊ້, ດັ່ງນັ້ນຈຶ່ງບໍ່ສົ່ງຜົນກະທົບໂດຍກົງຕໍ່ຜົນການປະເມີນ, ທຸກຢ່າງຕ້ອງອີງໃສ່ການຕອບກັບຂອງ assistant ຫຼັງຈາກໄດ້ຮັບຂໍ້ມູນແລ້ວຕໍ່ຜູ້ໃຊ້ເປັນຫຼັກ!
  - ສຳຄັນ: ສຳລັບ rubric ປະເພດຄຳສັ່ງຊື້ (ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້, ຕ້ອງສ້າງຄຳສັ່ງຊື້), ຕ້ອງຢືນຢັນວ່າ assistant ໄດ້ດຳເນີນການສັ່ງຊື້ສຳເລັດແທ້ຫຼືບໍ່. ມັນອາດຈະເກີດຂຶ້ນທີ່ assistant ຄິດວ່າໄດ້ສັ່ງຊື້ແລ້ວ, ແຕ່ຕົວຈິງແລ້ວການເອີ້ນໃຊ້ເຄື່ອງມືລົ້ມເຫຼວ; ຫຼື user ສະແດງວ່າສາມາດ "ສັ່ງຊື້ເອງໄດ້" ແລະ ອື່ນໆ, ຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບ rubric ທີ່ກ່ຽວຂ້ອງກັບລາຍລະອຽດຄຳສັ່ງຊື້ເຊັ່ນ ຈຳນວນສິນຄ້າ, ເວລາສົ່ງ, ຕ້ອງຕອບສະໜອງຄວາມຕ້ອງການຂອງ rubric ດັ້ງເດີມຢ່າງເຂັ້ມງວດ (ບໍ່ສາມາດມີຄວາມຜິດພາດກ່ຽວກັບຈຳນວນສິນຄ້າ, ບໍ່ສາມາດສົ່ງຊ້າກວ່າເວລາທີ່ຄາດຫວັງ), ການປະນີປະນອມຂອງຜູ້ໃຊ້ບໍ່ສົ່ງຜົນຕໍ່ຜົນການຕັດສິນ (ຕົວຢ່າງເຊັ່ນ user ສະແດງວ່າ "ສິນຄ້າບາງຢ່າງໜ້ອຍກໍໄດ້", "ບໍ່ມີຄວາມຄັດຄ້ານຕໍ່ເນື້ອຫາຄຳສັ່ງຊື້" ຫຼື "ສົ່ງຊ້າກໍໄດ້" ແລະ ອື່ນໆ), ສະຖານະການແບບນີ້ຍັງຄວນຖືວ່າບໍ່ຕອບສະໜອງຄວາມຕ້ອງການ
  - ສຳລັບ rubric ປະເພດທີ່ຢູ່ ຫຼື ໝາຍເຫດຄຳສັ່ງຊື້ທີ່ກ່ຽວຂ້ອງກັບການຈັບຄູ່ເນື້ອຫາຂໍ້ຄວາມ, ໃຊ້ຫຼັກການທຽບເທົ່າທາງໜ້າທີ່: ຖ້າເນື້ອຫາຕົວຈິງສາມາດບັນລຸໜ້າທີ່ດຽວກັນໄດ້ (ເຊັ່ນ ກຳນົດຕຳແໜ່ງຈັດສົ່ງໂດຍປະມານ ຫຼື ສື່ສານຄວາມຕ້ອງການຫຼັກຂອງລູກຄ້າ), ເຖິງແມ່ນວ່າການສະແດງອອກຈະບໍ່ຄືກັນສົມບູນ ຫຼື ຂາດລາຍລະອຽດບາງສ່ວນ, ກໍຖືວ່າຕອບສະໜອງຄວາມຕ້ອງການ
  - ຖ້າ window ປັດຈຸບັນບໍ່ກ່ຽວຂ້ອງກັບກົດລະບຽບໃດໜຶ່ງ, ໃຫ້ຮັກສາສະຖານະເດີມໄວ້; ຖ້າ window ປັດຈຸບັນກ່ຽວຂ້ອງກັບກົດລະບຽບໃດໜຶ່ງແຕ່ບໍ່ສາມາດຕັດສິນໄດ້ຢ່າງສົມບູນ, ສາມາດບັນທຶກຂໍ້ມູນສຳຄັນໃນ justification ເພື່ອລໍຖ້າການຕັດສິນໃນພາຍຫຼັງ
  - ໃນ justification ໃຫ້ບັນທຶກຂໍ້ມູນສຳຄັນທີ່ກ່ຽວຂ້ອງກັບ rubric ປັດຈຸບັນ ແລະ ຮອບທີ່ກົງກັນ [x] ໃນຮູບແບບການເພີ່ມເຕີມ, ຖ້າມີການປ່ຽນແປງສະຖານະກໍຕ້ອງບັນທຶກເຫດຜົນ, ໃຊ້ພາສາທີ່ກະທັດຮັດ

  # ຄວາມຕ້ອງການຮູບແບບ
  - ການຕອບກັບຂອງທ່ານຄວນເປັນວັດຖຸ JSON, ປະກອບມີຖານຂໍ້ມູນດັ່ງຕໍ່ໄປນີ້:
  - `rubric_idx`: ຕົວລະບຸເອກະລັກຂອງກົດລະບຽບ
  - `rubric`: ການກ່າວຊ້ຳກົດລະບຽບ
  - `justification`: ຄຳອະທິບາຍກ່ຽວກັບການປ່ຽນແປງສະຖານະ
  - `meetExpectation`: ສະຖານະຫຼັງຈາກອັບເດດ (true ຫຼື false)

  # ໂຄງສ້າງຕົວຢ່າງການປ້ອນຂໍ້ມູນ:
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # ໂຄງສ້າງຕົວຢ່າງການຕອບກັບ:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<ກ່າວຊ້ຳກົດລະບຽບ>",
        "justification": "<ຄຳອະທິບາຍສັ້ນໆກ່ຽວກັບການປ່ຽນແປງສະຖານະ, ບັນທຶກໃນຮູບແບບການເພີ່ມເຕີມ>",
        "meetExpectation": <true or false>
    }},
    ...
  ]
  ```
tamil: |-
  # அமைப்பு தகவல்
  {env_info}

  # பயனரின் முழுமையான வழிமுறை
  {user_instruction}

  # பின்னணி விளக்கம்
  - இது ஒரு assistant பயனரின் வழிமுறைகளை நிறைவேற்றும் செயல்முறையாகும், இதில் assistant தகவலைப் பெறவும் செயல்பாடுகளை முடிக்கவும் கருவிகளை அழைக்கலாம், கருவி திரும்பும் முடிவுகள் tool என்று தொடங்கும்
  - இந்த செயல்முறை assistant மற்றும் user இடையேயான உரையாடலில் நிறைவேற்றப்படுகிறது, மதிப்பீட்டு முடிவில் user பதில்களின் குறுக்கீட்டைத் தவிர்க்க, user பதில்களின் உள்ளடக்கம் மறைக்கப்பட்டுள்ளது, நீங்கள் assistant பதில்களின் உள்ளடக்கத்தில் மட்டும் கவனம் செலுத்தி, பயனரின் முழுமையான வழிமுறை நிறைவேற்றப்பட்டதா என மதிப்பிட வேண்டும்
  - மதிப்பீட்டை எளிதாக்க, பயனரின் முழுமையான வழிமுறை பல மதிப்பெண் புள்ளிகள் rubric ஆக பிரிக்கப்பட்டுள்ளது, நீங்கள் ஒவ்வொரு மதிப்பெண் புள்ளியும் பூர்த்தி செய்யப்பட்டதா என மட்டும் தீர்மானிக்க வேண்டும்
  - பணி சுற்றுகள் அதிகமாக இருப்பதால், நாங்கள் sliding window மதிப்பீட்டு முறையைப் பயன்படுத்துகிறோம், அதாவது ஒவ்வொரு முறையும் 10 சுற்று வெளியீடுகள் தெரியும், ஒவ்வொரு சாளரத்திற்கும் இடையில் 2 சுற்று ஒன்றுபட்டிருக்கும், ஆனால் rubric நிலை சாளரங்களுக்கு இடையில் பாதுகாக்கப்படும்
  - நீங்கள் {window_idx} வது சாளரத்தை மதிப்பிடுகிறீர்கள் (இந்த பணிக்கு மொத்தம் {total_windows} சாளரங்கள்)
  - <window_content> தற்போதைய சாளரத்தின் பணி முன்னேற்றத்தைக் கொண்டுள்ளது
  - <current_rubrics> தற்போதைய அனைத்து மதிப்பெண் புள்ளிகளின் நிலையைக் கொண்டுள்ளது (true என்பது பூர்த்தி செய்யப்பட்டது, false என்பது பூர்த்தி செய்யப்படவில்லை, அனைத்து மதிப்பெண் புள்ளிகளின் தொடக்க நிலை false ஆகும்)

  # பணி
  - தற்போதைய சாளரத்தின் பணி முன்னேற்றத்தின் அடிப்படையில், மதிப்பெண் புள்ளி rubric நிலையை புதுப்பிக்கவும்
  - assistant இந்த சாளரத்தில் இலக்கை நிறைவேற்றியிருந்தால் மட்டும், நீங்கள் நிலையை false இலிருந்து true ஆக புதுப்பிக்கலாம்
  - assistant இந்த சாளரத்தில் முந்தைய சரியான முடிவை மாற்றியிருந்தால் மட்டும், நீங்கள் true ஐ மீண்டும் false ஆக புதுப்பிக்கலாம் (ஆனால் கவனிக்கவும்: பயனர் தேவைகளே மாறினால், உதாரணமாக ஆர்டர் செய்த பிறகு தானாகவே ரத்து செய்தால், ஆர்டர் தேவைக்கான அசல் மதிப்பீட்டை மாற்றக்கூடாது)
  - தேவையற்ற மாற்றங்களைத் தவிர்க்க, தற்போதைய உரையாடல் சாளரத்தின் முன்னேற்றத்தைப் பெற நீங்கள் "பயனரின் முழுமையான வழிமுறை" ஐ குறிக்கலாம்

  # கவனிக்க வேண்டியவை
  - முக்கியம்: அனைத்து மதிப்பீடுகளும் assistant பதில்கள் மற்றும் கருவி அழைப்பு கோரிக்கைகள் rubric இல் உள்ள இலக்கை நிறைவேற்றியதா என்பதை அடிப்படையாகக் கொண்டவை, உரையாடலில் user assistant க்கு தெரிவிக்கும் உள்ளடக்கம் assistant க்கான குறிப்பு மற்றும் வழிகாட்டுதலாக மட்டுமே கருதப்படும், மதிப்பீட்டு நிலைகளை நேரடியாக பாதிக்காது, அனைத்தும் rubric புலத்தை அடிப்படையாகக் கொண்டது!
  - முக்கியம்: வினவல் வகை tool திரும்பும் முடிவுகள் assistant க்கு மட்டுமே தெரியும், இது user க்கு assistant பரிந்துரைக்கும் உள்ளடக்கத்தை குறிக்காது, எனவே இது மதிப்பீட்டு முடிவை நேரடியாக பாதிக்காது, அனைத்தும் assistant தகவலைப் பெற்ற பிறகு user க்கு அளிக்கும் பதிலை அடிப்படையாகக் கொண்டது!
  - முக்கியம்: ஆர்டர் வகை rubric க்கு (ஆர்டர் விவரங்களை உள்ளடக்கியது, ஆர்டரை உருவாக்க வேண்டும்), assistant உண்மையில் ஆர்டர் செயல்பாட்டை முடித்ததா என உறுதிப்படுத்த வேண்டும். assistant ஆர்டர் செயல்பாட்டை முடித்ததாக தவறாக நினைக்கலாம், உண்மையில் கருவி அழைப்பு தோல்வியடைந்திருக்கலாம்; அல்லது user "தானாக ஆர்டர் செய்யலாம்" என்று கூறும் நிலைகள் போன்றவை, அனைத்தும் தேவைகள் பூர்த்தி செய்யப்படவில்லை என கருதப்பட வேண்டும்
  - பொருள் அளவு, டெலிவரி நேரம் போன்ற ஆர்டர் விவரங்களை உள்ளடக்கிய rubric க்கு, அசல் rubric தேவைகள் கண்டிப்பாக பூர்த்தி செய்யப்பட வேண்டும் (பொருள் அளவில் வேறுபாடு இருக்கக்கூடாது, எதிர்பார்க்கப்படும் டெலிவரி நேரத்தை விட தாமதமாக இருக்கக்கூடாது), பயனர் சமரசம் செய்வது மதிப்பீட்டு முடிவை பாதிக்காது (உதாரணமாக user "சில பொருட்கள் குறைவாக இருந்தாலும் பரவாயில்லை", "ஆர்டர் உள்ளடக்கத்தில் எந்த ஆட்சேபனையும் இல்லை" அல்லது "தாமதமாக டெலிவரி செய்யலாம்" என்று கூறுவது போன்றவை), இத்தகைய நிலைகள் இன்னும் தேவைகள் பூர்த்தி செய்யப்படவில்லை என கருதப்பட வேண்டும்
  - உரை உள்ளடக்க பொருத்தமான முகவரி அல்லது ஆர்டர் குறிப்பு வகை rubric க்கு, செயல்பாட்டு சமன்மை கொள்கையைப் பயன்படுத்தவும்: உண்மையான உள்ளடக்கம் அதே செயல்பாட்டைச் செய்தால் (உதாரணமாக டெலிவரி இடத்தை தோராயமாக அடையாளம் காண்பது அல்லது வாடிக்கையாளரின் முக்கிய தேவைகளை தெரிவிப்பது), வெளிப்பாடு முழுமையாக ஒத்துப்போகாவிட்டாலும் அல்லது சில விவரங்கள் missing ஆக இருந்தாலும், தேவைகள் பூர்த்தி செய்யப்பட்டதாக கருதப்படும்
  - தற்போதைய சாளரம் ஒரு குறிப்பிட்ட விதியை உள்ளடக்கவில்லை என்றால், அதன் அசல் நிலையை மாற்றாமல் வைத்திருக்கவும்; தற்போதைய சாளரம் ஒரு குறிப்பிட்ட விதியை உள்ளடக்கியது ஆனால் முழுமையாக தீர்மானிக்க முடியவில்லை என்றால், முக்கிய தகவலை justification இல் பதிவு செய்து பின்னர் தீர்மானிக்கலாம்
  - justification இல் தற்போதைய rubric உடன் தொடர்புடைய முக்கிய தகவல் மற்றும் அதற்கான சுற்று [x] ஐ சேர்க்கும் வடிவத்தில் பதிவு செய்யவும், நிலை மாற்றம் நிகழ்ந்தால் காரணத்தையும் பதிவு செய்ய வேண்டும், சுருக்கமான மொழியைப் பயன்படுத்தவும்

  # வடிவமைப்பு தேவைகள்
  - உங்கள் பதில் ஒரு JSON பொருளாக இருக்க வேண்டும், பின்வரும் புலங்களைக் கொண்டிருக்க வேண்டும்:
  - `rubric_idx`：விதியின் தனித்துவமான அடையாளங்காட்டி
  - `rubric`：விதியின் மறு கூற்றல்
  - `justification`：நிலை மாற்றத்திற்கான விளக்கம்
  - `meetExpectation`：புதுப்பிக்கப்பட்ட நிலை (true அல்லது false)

  # மாதிரி உள்ளீட்டு கட்டமைப்பு：
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # மாதிரி பதில் கட்டமைப்பு：
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<விதியின் மறு கூற்றல்>",
        "justification": "<நிலை மாற்றத்திற்கான சுருக்கமான விளக்கம், சேர்க்கும் வடிவத்தில் பதிவு செய்யவும்>",
        "meetExpectation": <true அல்லது false>
    }},
    ...
  ]
  ```
telugu: |-
  # సిస్టమ్ సమాచారం
  {env_info}

  # వినియోగదారు పూర్తి సూచన
  {user_instruction}

  # నేపథ్య వివరణ
  - ఇది ఒక assistant వినియోగదారు సూచనలను పూర్తి చేసే ప్రక్రియ, ఇందులో assistant సమాచారాన్ని పొందడానికి మరియు పనులను పూర్తి చేయడానికి సాధనాలను (tools) పిలవగలదు, సాధనం తిరిగి ఇచ్చే ఫలితాలు tool తో ప్రారంభమవుతాయి
  - ఈ ప్రక్రియ assistant మరియు user మధ్య సంభాషణలో పూర్తవుతుంది, user స్పందనలు అంచనా ఫలితాలను ప్రభావితం చేయకుండా ఉండటానికి, user స్పందనల విషయం దాచబడింది, మీరు కేవలం assistant స్పందనలపై దృష్టి పెట్టి, వినియోగదారు పూర్తి సూచన పూర్తయిందో లేదో అంచనా వేయాలి
  - అంచనా వేయడం సులభతరం చేయడానికి, వినియోగదారు పూర్తి సూచనను అనేక స్కోరింగ్ పాయింట్లు rubricలుగా విభజించారు, మీరు ప్రతి స్కోరింగ్ పాయింట్ సంతృప్తి చెరిందో లేదో మాత్రమే నిర్ణయించాలి
  - పనుల చక్రాలు ఎక్కువగా ఉన్నందున, మేము స్లైడింగ్ విండో అంచనా పద్ధతిని ఉపయోగిస్తాము, అంటే ప్రతిసారీ 10 చక్రాల అవుట్‌పుట్ కనిపిస్తుంది, ప్రతి విండో మధ్య 2 చక్రాలు ఓవర్‌లాప్ అవుతాయి, కానీ rubric స్థితి విండోల అంతటా నిలుపుబడుతుంది
  - మీరు {window_idx}వ విండోను అంచనా వేస్తున్నారు (ఈ పనికి మొత్తం {total_windows} విండోలు ఉన్నాయి)
  - <window_content> ప్రస్తుత విండోలోని పని పురోగతిని కలిగి ఉంది
  - <current_rubrics> ప్రస్తుత అన్ని స్కోరింగ్ పాయింట్ల స్థితిని కలిగి ఉంది (true అంటే సంతృప్తి చెందింది, false అంటే సంతృప్తి చెందలేదు, అన్ని స్కోరింగ్ పాయింట్ల ప్రారంభ స్థితి false)

  # పని
  - ప్రస్తుత విండోలోని పని పురోగతి ఆధారంగా, స్కోరింగ్ పాయింట్ rubric స్థితిని నవీకరించండి
  - మీరు స్థితిని false నుండి true గా నవీకరించవచ్చు, అది కూడా assistant ఈ విండోలో ఆ లక్ష్యాన్ని పూర్తి చేసినప్పుడు మాత్రమే
  - మీరు true ని మళ్లీ false గా నవీకరించవచ్చు, అది కూడా assistant ఈ విండోలో ముందు సరైన నిర్ధారణను తోసిపుచ్చినప్పుడు మాత్రమే (కానీ గమనించండి: వినియోగదారు అవసరాలు స్వయంగా మారినట్లయితే, ఉదాహరణకు ఆర్డర్ చేసిన తర్వాత స్వయంగా రద్దు చేసుకోవడం, అప్పుడు ఆర్డర్ అవసరాల అంచనాను తోసిపుచ్చకూడదు)
  - అనవసరమైన మార్పులు రాకుండా ఉండటానికి, ప్రస్తుత సంభాషణ విండో పురోగతిని తెలుసుకోవడానికి మీరు "వినియోగదారు పూర్తి సూచన"ను సూచించవచ్చు

  # గమనికలు
  - ముఖ్యం: అన్ని అంచనాలు assistant స్పందనలు మరియు సాధనం పిలుపు కోరికలు rubricలోని లక్ష్యాలను పూర్తి చేశాయో లేదో అనే దానిపై ఆధారపడి ఉంటాయి, సంభాషణలో user assistant కు తెలియజేసిన విషయాలు కేవలం assistant కు సూచనలు మరియు మార్గదర్శకాలుగా మాత్రమే పరిగణించబడతాయి, అంచనా ప్రమాణాలపై నేరుగా ప్రభావం చూపవు, అన్నీ rubric ఫీల్డ్‌లపై ఆధారపడి ఉంటాయి!
  - ముఖ్యం: క్వెరీ రకం tool తిరిగి ఇచ్చే ఫలితాలు కేవలం assistant కు మాత్రమే కనిపిస్తాయి, ఇవి assistant వినియోగదారుకు సిఫార్సు చేసిన విషయాలను సూచించవు, కాబట్టి ఇవి అంచనా ఫలితాలపై నేరుగా ప్రభావం చూపవు, అన్నీ assistant సమాచారాన్ని పొందిన తర్వాత వినియోగదారుకు ఇచ్చే స్పందనపై ఆధారపడి ఉంటాయి!
  - ముఖ్యం: ఆర్డర్ రకం rubricల కోసం (ఆర్డర్ వివరాలకు సంబంధించినవి, ఆర్డర్ సృష్టించాల్సిన అవసరం ఉన్నవి), assistant నిజంగా ఆర్డర్ చేసే పనిని పూర్తి చేసిందో లేదో నిర్ధారించుకోవాలి. assistant ఆర్డర్ చేసినట్లు తప్పుగా భావించి ఉండవచ్చు, వాస్తవానికి సాధనం పిలుపు విఫలమై ఉండవచ్చు; లేదా user "నేను స్వయంగా ఆర్డర్ చేసుకోగలను" అని చెప్పిన సందర్భాలు కూడా అవసరాలు సంతృప్తి చెందలేదని పరిగణించాలి
  - వస్తువుల సంఖ్య, డెలివరీ సమయం వంటి ఆర్డర్ వివరాలను కలిగి ఉన్న rubricల కోసం, అసలు rubric అవసరాలను కచ్చితంగా సంతృప్తి పరచాలి (వస్తువుల సంఖ్యలో తేడా ఉండకూడదు, అనుకున్న డెలివరీ సమయం కంటే ఆలస్యం కాకూడదు), వినియోగదారు రాజీ పడటం అంచనా ఫలితాన్ని ప్రభావితం చేయదు (ఉదాహరణకు user "కొన్ని వస్తువులు తక్కువగా ఉన్నా పర్వాలేదు", "ఆర్డర్ విషయంలో అభ్యంతరం లేదు" లేదా "కాసేపు ఆలస్యమైనా పర్వాలేదు" అని చెప్పినా), ఇటువంటి సందర్భాలు ఇప్పటికీ అవసరాలు సంతృప్తి చెందలేదని పరిగణించాలి
  - టెక్స్ట్ కంటెంట్ మ్యాచింగ్ చిరునామా లేదా ఆర్డర్ నోట్స్ రకం rubricల కోసం, ఫంక్షనల్ ఈక్వివలెన్స్ సూత్రాన్ని ఉపయోగించండి: వాస్తవ కంటెంట్ ఒకే ఫంక్షన్‌ను నిర్వహించగలిగితే (ఉదాహరణకు డెలివరీ స్థలాన్ని సుమారుగా గుర్తించడం లేదా కస్టమర్ ప్రధాన అవసరాలను తెలియజేయడం), వ్యక్తీకరణ పూర్తిగా సమానంగా లేకపోయినా లేదా కొన్ని వివరాలు లేకపోయినా, అవసరాలు సంతృప్తి చెందినట్లు పరిగణించాలి
  - ప్రస్తుత విండోలో ఏదైనా నియమం సంబంధించకపోతే, దాని అసలు స్థితిని మార్చకుండా ఉంచండి; ప్రస్తుత విండోలో ఏదైనా నియమం సంబంధించినా పూర్తిగా నిర్ణయించలేకపోతే, కీలక సమాచారాన్ని justificationలో నమోదు చేసి తర్వాతి నిర్ణయం కోసం వదిలేయవచ్చు
  - justificationలో ప్రస్తుత rubricకు సంబంధించిన కీలక సమాచారం మరియు దానికి సంబంధించిన చక్రం [x]ను జోడించే రూపంలో నమోదు చేయండి, స్థితి మార్పు జరిగితే కారణాన్ని కూడా నమోదు చేయాలి, సంక్షిప్తమైన భాషను ఉపయోగించండి

  # ఫార్మాట్ అవసరాలు
  - మీ స్పందన ఒక JSON ఆబ్జెక్ట్‌గా ఉండాలి, ఇందులో క్రింది ఫీల్డ్‌లు ఉంటాయి:
  - `rubric_idx`: నియమం యొక్క ప్రత్యేక గుర్తింపు
  - `rubric`: నియమం యొక్క పునరుచ్చరణ
  - `justification`: స్థితి మార్పుకు వివరణ
  - `meetExpectation`: నవీకరించబడిన స్థితి (true లేదా false)

  # ఉదాహరణ ఇన్‌పుట్ నిర్మాణం:
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # ఉదాహరణ స్పందన నిర్మాణం:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<నియమం పునరుచ్చరణ>",
        "justification": "<స్థితి మార్పుకు సంక్షిప్త వివరణ, జోడించే రూపంలో నమోదు చేయాలి>",
        "meetExpectation": <true లేదా false>
    }},
    ...
  ]
  ```
korean: |-
  # 시스템 정보
  {env_info}

  # 사용자 전체 지침
  {user_instruction}

  # 배경 설명
  - 이는 assistant 가 user 의 지침을 완료하는 과정으로, assistant 는 도구를 호출하여 정보를 얻고 작업을 완료할 수 있으며, 도구 반환 결과는 tool 로 시작합니다
  - 이 과정은 assistant 와 user 가 대화 중에 완료하는 것이며, user 의 응답이 평가 결과에 간섭하는 것을 방지하기 위해 user 의 응답 내용은 숨겨져 있습니다. 당신은 assistant 의 응답 내용에만 주목하고 사용자 전체 지침이 완료되었는지 평가하면 됩니다
  - 평가의 편의를 위해 사용자의 전체 지침은 여러 평가 항목 rubric 으로 분할되었으며, 당신은 각 평가 항목이 충족되었는지 판단하면 됩니다
  - 작업 라운드가 많으므로 슬라이딩 윈도우 평가법을 사용합니다. 즉, 매번 10 라운드 출력이 보이며, 각 윈도우 간에 2 라운드 중복이 있지만, rubric 상태는 윈도우 간에 걸쳐 유지됩니다
  - 당신은 현재 {window_idx} 번째 윈도우를 평가 중입니다 (이번 작업은 총 {total_windows} 개의 윈도우입니다)
  - <window_content>에는 현재 윈도우의 작업 진행 상황이 포함되어 있습니다
  - <current_rubrics>에는 현재 모든 평가 항목의 상태가 포함되어 있습니다 (true 는 충족됨을, false 는 충족되지 않음을 나타내며, 모든 평가 항목의 초기 상태는 false 입니다)

  # 작업
  - 현재 윈도우의 작업 진행 상황에 기반하여 평가 항목 rubric 의 상태를 업데이트합니다
  - assistant 가 이 윈도우에서 해당 목표를 완료한 경우에만 상태를 false 에서 true 로 업데이트할 수 있습니다
  - assistant 가 이 윈도우에서 이전의 올바른 결론을 번복한 경우에만 true 를 다시 false 로 업데이트할 수 있습니다 (단, 주의 사항: 사용자 요구 사항 자체가 변경된 경우, 예를 들어 주문 후 스스로 취소한 경우에는 원래 주문 요구 사항에 대한 평가를 번복해서는 안 됩니다)
  - 불필요한 수정을 피하기 위해 '사용자 전체 지침'을 참조하여 현재 대화 윈도우의 진행 상황을 파악할 수 있습니다

  # 주의 사항
  - 중요: 모든 평가는 assistant 의 응답 및 도구 호출 요청이 rubric 의 목표를 완료했는지 여부를 기준으로 합니다. user 가 대화 중 assistant 에게 전달한 내용은 assistant 에 대한 힌트 및 가이드로만 간주되며 평가 기준에 직접적인 영향을 미치지 않습니다. 모든 것은 rubric 필드를 기준으로 합니다!
  - 중요: 조회류 tool 이 반환한 결과는 assistant 에게만 보이며, assistant 가 사용자에게 추천한 내용을 나타내지 않으므로 평가 결과에 직접적인 영향을 미치지 않습니다. 모든 것은 assistant 가 정보를 얻은 후 사용자에게 한 응답을 기준으로 합니다!
  - 중요: 주문류 rubric(주문 세부 사항 포함, 주문 생성 필수) 의 경우, assistant 가 실제로 주문 작업을 완료했는지 확인해야 합니다. assistant 가 주문 작업을 완료했다고 오인했지만 실제로 도구 호출이 실패했거나, user 가 "스스로 주문할 수 있음"이라고 표시한 경우 등은 모두 요구 사항 미충족으로 간주됩니다
  - 상품 수량, 배송 시간 등 주문 세부 사항과 관련된 rubric 의 경우, 원래 rubric 요구 사항을 엄격히 충족해야 합니다 (상품 수량 편차 불가, 희망 배송 시간보다 늦어지면 안 됨). 사용자의 양보 행동은 평가 결과에 영향을 미치지 않습니다 (예: user 가 "어떤 상품은 적어도 됨", "주문 내용에 이의 없음" 또는 "늦게 배송되어도 됨"이라고 표시한 경우 등). 이러한 경우에도 요구 사항 미충족으로 간주됩니다
  - 텍스트 내용 매칭과 관련된 주소 또는 주문 비고류 rubric 의 경우, 기능적 동등성 원칙을 적용합니다: 실제 내용이 동일한 기능을 수행할 수만 있다면 (예: 배송地点 대략적 위치 지정 또는 고객의 주요 요구 사항 전달), 표현이 완전히 일치하지 않거나 일부 세부 사항이 부족하더라도 요구 사항 충족으로 간주됩니다
  - 현재 윈도우에 특정 규칙이 포함되지 않은 경우, 기존 상태를 유지합니다. 현재 윈도우에 특정 규칙이 포함되었지만 완전히 결정할 수 없는 경우, 핵심 정보를 justification 에 기록하여 후속 판단을 기다릴 수 있습니다
  - justification 에 현재 rubric 과 관련된 핵심 정보 및 해당 라운드 [x] 를 추가 형태로 기록합니다. 상태 수정이 발생한 경우 이유도 기록해야 하며, 간결한 언어를 사용합니다

  # 형식 요구 사항
  - 당신의 응답은 다음 필드를 포함하는 JSON 객체여야 합니다:
  - `rubric_idx`: 규칙의 고유 식별자
  - `rubric`: 규칙에 대한 재진술
  - `justification`: 상태 변화에 대한 설명
  - `meetExpectation`: 업데이트된 상태 (true 또는 false)

  # 예시 입력 구조:
  <window_content>xxx</window_content>
  <current_rubrics>xxx</current_rubrics>

  # 예시 응답 구조:
  ```json
  [
    {{
        "rubric_idx": "rubric_0",
        "rubric": "<규칙 재진술>",
        "justification": "<상태 변화에 대한 간략한 설명，추가 형태로 기록>",
        "meetExpectation": <true or false>
    }},
    ...
  ]
  ```
